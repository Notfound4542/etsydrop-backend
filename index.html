<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
/* ============================================================
   EtsyDrop — Couche d'intégration API réelle
   Backend: https://etsydrop-backend-production.up.railway.app
   Auth: Supabase (wlqzhoixoxrtueldsqkv)

   Corrections apportées au script d'origine (commit "Add EtsyDrop API
   integration script") : plusieurs endpoints étaient appelés avec la
   mauvaise méthode HTTP ou les mauvais noms de champs/paramètres par
   rapport aux routers FastAPI réels (backend/routers/*.py), et les
   données chargées étaient écrites sur des propriétés Alpine qui
   n'existaient dans aucun template (donc jamais affichées).
   ============================================================ */
(function () {
  'use strict';

  const BACKEND   = 'https://etsydrop-backend-production.up.railway.app';
  const SB_URL    = 'https://wlqzhoixoxrtueldsqkv.supabase.co';
  const SB_KEY    = 'sb_publishable_M-2zNvOpk644GMzrC_-k-g_kSR83Mun';

  /* ---- Session ---- */
  let _session = null;

  function _saveSession(s) {
    _session = s;
    try { sessionStorage.setItem('ed_session', JSON.stringify(s)); } catch(e) {}
  }

  function _restoreSession() {
    try {
      const raw = sessionStorage.getItem('ed_session');
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s.expires_at && Date.now() / 1000 > s.expires_at - 60) {
        sessionStorage.removeItem('ed_session');
      } else {
        _session = s;
      }
    } catch(e) {}
  }

  /* ---- Supabase auth ---- */
  async function _sbFetch(path, opts = {}) {
    const res = await fetch(SB_URL + path, {
      ...opts,
      headers: {
        apikey: SB_KEY,
        'Content-Type': 'application/json',
        ...(opts.headers || {})
      }
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error_description || json.error_code || json.message || 'Supabase error ' + res.status);
    return json;
  }

  async function signIn(email, password) {
    const data = await _sbFetch('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    _saveSession(data);
    return data;
  }

  async function signUp(email, password) {
    const data = await _sbFetch('/auth/v1/signup', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    if (data.access_token) _saveSession(data);
    return data;
  }

  async function signOut() {
    if (_session?.access_token) {
      await _sbFetch('/auth/v1/logout', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + _session.access_token }
      }).catch(() => {});
    }
    _session = null;
    try { sessionStorage.removeItem('ed_session'); } catch(e) {}
  }

  async function refreshToken() {
    if (!_session?.refresh_token) return null;
    try {
      const data = await _sbFetch('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        body: JSON.stringify({ refresh_token: _session.refresh_token })
      });
      _saveSession(data);
      return data;
    } catch(e) { return null; }
  }

  /* ---- Backend API ---- */
  async function api(path, opts = {}) {
    if (_session?.expires_at && Date.now() / 1000 > _session.expires_at - 120) {
      await refreshToken();
    }
    if (!_session?.access_token) throw new Error('Non authentifié');
    const res = await fetch(BACKEND + path, {
      ...opts,
      headers: {
        Authorization: 'Bearer ' + _session.access_token,
        'Content-Type': 'application/json',
        ...(opts.headers || {})
      }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'HTTP ' + res.status }));
      throw new Error(err.detail || 'API error ' + res.status);
    }
    return res.json();
  }

  /* ---- Public API ----
     Chemins/méthodes/paramètres alignés sur les signatures réelles des
     routers FastAPI. Listings et Orders n'ont PAS de pagination côté API
     et renvoient un tableau JSON brut (pas de wrapper {items:[...]}).
     Sourcing/search et Shop/analyze sont en POST avec un body JSON. */
  window.EDAPI = {
    get session() { return _session; },
    get isLoggedIn() { return !!_session?.access_token; },
    signIn, signUp, signOut, refreshToken, restoreSession: _restoreSession,

    // Analytics
    summary:    ()             => api('/api/analytics/summary'),
    revenue:    (period)       => api('/api/analytics/revenue?period=' + (period || '30d')),
    margin:     (params)       => api('/api/analytics/margin?' + new URLSearchParams(params).toString()),

    // Listings
    listings:   (stockStatus)  => api('/api/listings/' + (stockStatus ? '?stock_status=' + stockStatus : '')),
    listing:    (id)           => api('/api/listings/' + id),

    // Orders
    orders:     ()             => api('/api/orders/'),
    order:      (id)           => api('/api/orders/' + id),
    fulfill:    (id, d)        => api('/api/orders/' + id + '/fulfill', { method:'POST', body:JSON.stringify(d) }),

    // Etsy OAuth
    me:             ()  => api('/api/auth/me'),
    etsyLogin:      (shopName) => api('/api/auth/etsy/login?shop_name=' + encodeURIComponent(shopName)),
    etsyDisconnect: ()  => api('/api/auth/etsy/disconnect', { method:'DELETE' }),

    // Keywords / SEO
    keywords:   (q)            => api('/api/keywords/search?q=' + encodeURIComponent(q)),
    keywordMkt: (q, market)    => api('/api/keywords/market-search?q=' + encodeURIComponent(q) + (market ? '&market=' + market : '')),
    keywordDtl: (kw)           => api('/api/keywords/' + encodeURIComponent(kw)),

    // Sourcing
    sourcingSearch:  (query, countryCode) => api('/api/sourcing/search', { method:'POST', body: JSON.stringify({ query, country_code: countryCode }) }),
    sourcingCompare: (q)                  => api('/api/sourcing/compare?q=' + encodeURIComponent(q)),

    // Shop analyzer
    analyzeShop: (shopName)    => api('/api/shop/analyze', { method:'POST', body: JSON.stringify({ shop_name: shopName }) }),

    // AI generation
    genImage:   (d)            => api('/api/generate/image',   { method:'POST', body:JSON.stringify(d) }),
    genListing: (d)            => api('/api/generate/listing', { method:'POST', body:JSON.stringify(d) }),

    // Pricing
    calcPrice:  (d)            => api('/api/pricing/calculate', { method:'POST', body:JSON.stringify(d) }),

    // Promotion
    pinterest:  (d)            => api('/api/promotion/pinterest/publish', { method:'POST', body:JSON.stringify(d) }),

    // Ads
    adsSync:    (d)            => api('/api/ads/sync', { method:'POST', body: JSON.stringify(d) }),
    adsDash:    ()             => api('/api/ads/dashboard'),

    // Billing
    billingStatus:   ()        => api('/api/billing/status'),
    billingCheckout: (d)       => api('/api/billing/create-checkout', { method:'POST', body:JSON.stringify(d) }),

    // Health
    health: () => fetch(BACKEND + '/api/health').then(r => r.json()),
  };

  /* ---- Login modal (injecté dans le DOM) ----
     Volontairement sans classes Tailwind dark: — le site gère le dark mode
     via des overrides .dark X sur les classes de base (voir <style> plus
     bas), donc bg-white/text-ink-900/input sont déjà stylés correctement
     dans les deux thèmes sans rien ajouter ici. */
  function injectLoginModal() {
    const modal = document.createElement('div');
    modal.id = 'ed-auth-modal';
    modal.innerHTML = `
      <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm" id="ed-auth-overlay">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-8">
          <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-accent flex items-center justify-center">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <div>
              <h1 class="text-xl font-bold text-ink-900">EtsyDrop</h1>
              <p class="text-xs text-gray-400">Dropshipping intelligent pour Etsy</p>
            </div>
          </div>
          <div id="ed-login-form">
            <h2 class="text-lg font-semibold text-ink-900 mb-1" id="ed-auth-title">Connexion</h2>
            <p class="text-sm text-gray-500 mb-5" id="ed-auth-sub">Connectez-vous pour accéder à votre tableau de bord</p>
            <div id="ed-auth-error" class="hidden mb-3 p-3 rounded-lg bg-rose-50 text-rose-600 text-sm"></div>
            <div class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="ed-email" class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm outline-none focus:border-accent" placeholder="vous@exemple.com">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input type="password" id="ed-password" class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm outline-none focus:border-accent" placeholder="••••••••">
              </div>
              <button id="ed-submit-btn" onclick="window._edAuthSubmit()" class="w-full py-2.5 px-4 bg-accent hover:bg-accent-dark text-ink-900 font-bold rounded-lg text-sm transition-colors">
                Se connecter
              </button>
            </div>
            <p class="mt-4 text-center text-sm text-gray-500">
              <span id="ed-toggle-text">Pas encore de compte ?</span>
              <button id="ed-toggle-btn" onclick="window._edToggleMode()" class="text-accent font-semibold hover:underline ml-1">S'inscrire</button>
            </p>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  window._edAuthMode = 'login';
  window._edToggleMode = function() {
    window._edAuthMode = window._edAuthMode === 'login' ? 'signup' : 'login';
    const isLogin = window._edAuthMode === 'login';
    document.getElementById('ed-auth-title').textContent = isLogin ? 'Connexion' : 'Créer un compte';
    document.getElementById('ed-auth-sub').textContent = isLogin
      ? 'Connectez-vous pour accéder à votre tableau de bord'
      : 'Créez votre compte EtsyDrop gratuitement';
    document.getElementById('ed-submit-btn').textContent = isLogin ? 'Se connecter' : 'Créer un compte';
    document.getElementById('ed-toggle-text').textContent = isLogin ? 'Pas encore de compte ?' : 'Déjà un compte ?';
    document.getElementById('ed-toggle-btn').textContent = isLogin ? "S'inscrire" : 'Se connecter';
  };

  window._edAuthSubmit = async function() {
    const email = document.getElementById('ed-email').value.trim();
    const password = document.getElementById('ed-password').value;
    const btn = document.getElementById('ed-submit-btn');
    const errEl = document.getElementById('ed-auth-error');
    if (!email || !password) { errEl.textContent = 'Remplissez tous les champs.'; errEl.classList.remove('hidden'); return; }
    btn.disabled = true;
    btn.textContent = 'Chargement…';
    errEl.classList.add('hidden');
    try {
      if (window._edAuthMode === 'login') {
        await window.EDAPI.signIn(email, password);
      } else {
        const res = await window.EDAPI.signUp(email, password);
        if (!res.access_token) {
          errEl.textContent = 'Vérifiez votre email pour confirmer votre inscription.';
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Créer un compte';
          return;
        }
      }
      document.getElementById('ed-auth-modal').remove();
      await window._edPostAuth();
    } catch(e) {
      errEl.textContent = e.message || 'Erreur. Réessayez.';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = window._edAuthMode === 'login' ? 'Se connecter' : 'Créer un compte';
    }
  };

  /* ---- Mappe une fiche produit backend (models.Listing) vers la forme
     attendue par catalogProducts (voir app() > Catalogue). Le backend ne
     fournit ni images ni comparatif fournisseurs : on utilise des visuels
     de substitution et un tableau suppliers vide plutôt que d'inventer des
     données. ---- */
  const STOCK_LABELS = { available: 'disponible', low_stock: 'stock_faible', out_of_stock: 'rupture' };
  const SUPPLIER_LABELS = {
    my_catalog: 'Mon catalogue', eprolo: 'Eprolo', cj_dropshipping: 'CJ Dropshipping',
    printify: 'Printify', printful: 'Printful', zendrop: 'Zendrop', aliexpress: 'AliExpress'
  };
  function _mapListing(l) {
    // l.image_url : vraie image Etsy (voir etsy_client.py > fetch_listing_image_url),
    // absente pour une fiche créée à la main sans image — dans ce seul cas,
    // fallback sur un visuel de substitution plutôt que de casser l'affichage.
    const realImage = l.image_url || null;
    return {
      id: l.id,
      name: l.name,
      image: realImage || ('https://picsum.photos/seed/' + encodeURIComponent(l.id) + '/400/400'),
      images: realImage ? [realImage] : [0, 1, 2, 3, 4, 5].map(i => 'https://picsum.photos/seed/' + encodeURIComponent(l.id) + i + '/700/700'),
      variantsCount: (l.variants || []).length,
      priceMin: l.price_min,
      priceMax: l.price_max,
      margin: Math.round(l.margin_pct),
      stock: STOCK_LABELS[l.stock_status] || 'disponible',
      supplier: SUPPLIER_LABELS[l.supplier] || l.supplier,
      baseCost: (l.variants && l.variants[0]) ? (l.variants[0].price ?? l.variants[0].supplier_price ?? 0) : 0,
      freeShipping: false,
      description: l.description,
      tags: l.tags || [],
      // Forme brute conservée telle quelle : {label, price, quantity} pour une
      // fiche importée depuis Etsy (propriétés arbitraires — voir
      // etsy_client.py > fetch_listing_variants), {color, size, engraving,
      // supplier_price} pour une fiche créée à la main. app() > variantLabel()
      // / variantPrice() gèrent les deux formes à l'affichage.
      variants: l.variants || [],
      suppliers: []
    };
  }

  /* ---- Mappe une commande backend (models.Order) vers la forme attendue
     par le tableau Commandes (voir orders + orderStatusMeta() dans app()).
     `status` reste la valeur brute de l'enum OrderStatus : c'est
     orderStatusMeta() côté template qui la traduit en libellé/couleur. ---- */
  function _mapOrder(o) {
    return {
      id: '#' + o.etsy_order_id,
      customer: o.customer_name,
      product: o.product_name,
      supplier: SUPPLIER_LABELS[o.supplier] || o.supplier,
      amount: o.amount,
      status: o.status,
      tracking: o.tracking_number || '—'
    };
  }

  /* ---- Post-auth : charge les vraies données dans l'état Alpine ---- */
  window._edPostAuth = async function() {
    const rootEl = document.querySelector('[x-data]');
    if (!rootEl || !window.Alpine) return;
    const state = window.Alpine.$data(rootEl);
    if (!state) return;

    state.currentUserEmail = _session?.user?.email || null;

    try {
      const me = await window.EDAPI.me().catch(() => null);
      if (me) state.etsyConnected = !!me.etsy_shop_connected;

      // Une fois la boutique connectée, les données réelles (même vides/à
      // zéro) DOIVENT remplacer les données de démo — sinon un échec d'appel
      // ou une boutique sans historique laisse les faux chiffres/produits de
      // démo affichés, indiscernables de vraies données pour l'utilisateur.
      // Avant connexion, les données de démo restent (aperçu du produit).
      if (me && me.etsy_shop_connected) {
        // /api/analytics/revenue interroge les receipts Etsy en direct avec le
        // token OAuth stocké — seule source de revenu réellement connectée.
        // revenue_net = revenu moins frais Etsy uniquement (pas de coût
        // fournisseur connu pour une fiche importée) : ce n'est PAS un vrai
        // bénéfice net, voir le libellé de la card "Revenu net (hors coûts
        // fournisseur)" plutôt que "Bénéfice net".
        const revenue = await window.EDAPI.revenue('30d').catch(() => null);
        state.revenueTotal = revenue ? revenue.revenue_gross : 0;
        state.revenueDisplay = revenue ? revenue.revenue_gross : 0;
        state.netProfit = revenue ? revenue.revenue_net : 0;
        state.ordersCount = revenue ? revenue.orders_count : 0;
        state.topProductTitle = (revenue && revenue.top_products && revenue.top_products[0]) ? revenue.top_products[0].title : null;

        const listings = await window.EDAPI.listings().catch(() => null);
        state.catalogProducts = Array.isArray(listings) ? listings.map(_mapListing) : [];

        const orders = await window.EDAPI.orders().catch(() => null);
        state.orders = Array.isArray(orders) ? orders.map(_mapOrder) : [];
      }
    } catch(e) {
      console.warn('[EtsyDrop] Erreur chargement données:', e);
    }
  };

  /* ---- Déclenche _edPostAuth() une fois Alpine réellement prêt.
     Alpine (script `defer`, voir plus bas dans <head>) s'initialise et émet
     "alpine:initialized" AVANT que "DOMContentLoaded" ne se déclenche sur ce
     document (un script `defer` s'exécute après le parsing du DOM mais
     toujours avant DOMContentLoaded). Ce bloc-ci est un <script> NON deferré,
     exécuté pendant le parsing du <head> : le addEventListener('alpine:
     initialized', …) posé à l'intérieur du handler DOMContentLoaded arrivait
     donc TOUJOURS après que l'événement ait déjà été émis — l'écouteur
     n'était jamais déclenché, et _edPostAuth() ne tournait alors que sur le
     setTimeout(500ms) de secours après une redirection OAuth Etsy (jamais
     sur un rechargement de page normal, où catalogProducts/etsyConnected
     restaient bloqués sur leurs valeurs par défaut). Un polling court, sans
     dépendre d'un événement qui a pu déjà avoir eu lieu, est fiable dans les
     deux cas. ---- */
  function _runPostAuthWhenReady(attempt) {
    attempt = attempt || 0;
    let state = null;
    try {
      // Alpine.$data() lève une exception (pas juste undefined) tant que
      // l'élément [x-data] n'a pas encore été traité par Alpine — d'où le
      // try/catch, indispensable pour que le polling puisse réessayer au
      // lieu de planter dès la première tentative trop précoce.
      const rootEl = document.querySelector('[x-data]');
      state = (window.Alpine && rootEl) ? window.Alpine.$data(rootEl) : null;
    } catch (e) {
      state = null;
    }
    if (state) {
      window._edPostAuth();
    } else if (attempt < 50) {
      setTimeout(() => _runPostAuthWhenReady(attempt + 1), 100);
    } else {
      console.warn('[EtsyDrop] Alpine jamais prêt après 5s — _edPostAuth() abandonné.');
    }
  }

  /* ---- Bootstrap ---- */
  document.addEventListener('DOMContentLoaded', function () {
    _restoreSession();

    if (window.EDAPI.isLoggedIn) {
      _runPostAuthWhenReady();
    } else {
      injectLoginModal();
    }

    // Etsy redirige ici avec ?etsy_connected=true ou ?etsy_error=... une fois
    // l'échange terminé côté backend (voir routers/auth.py > /etsy/callback).
    const params = new URLSearchParams(window.location.search);
    if (params.get('etsy_connected') || params.get('etsy_error')) {
      window.history.replaceState({}, '', window.location.pathname);
    }
  });

  /* ---- Helpers exposés aux boutons du template ---- */
  window.edConnectEtsy = async function(shopName) {
    const name = (shopName || '').trim();
    if (!name) {
      alert('Indique le nom exact de ta boutique Etsy avant de te connecter.');
      return;
    }
    try {
      const data = await window.EDAPI.etsyLogin(name);
      if (data.authorize_url) window.location.href = data.authorize_url;
    } catch(e) {
      alert('Erreur Etsy : ' + e.message);
    }
  };

  window.edDisconnectEtsy = async function() {
    try {
      await window.EDAPI.etsyDisconnect();
      await window._edPostAuth();
    } catch(e) {
      alert('Erreur Etsy : ' + e.message);
    }
  };

  window.edLogout = async function() {
    await window.EDAPI.signOut();
    window.location.reload();
  };

})();
</script>

  .dark .text-ink-800 { color: #E5E7EB !important; }
  .dark .text-gray-700 { color: #D1D5DB !important; }

  .dark .text-gray-500 { color: #838C99 !important; }
  .dark .text-gray-400 { color: #5B6472 !important; }

  .lqs-bg { stroke: #F1F2F4; }
  .dark .lqs-bg { stroke: #262B35; }

<body class="bg-canvas text-ink-800 antialiased">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<div x-data="app()" x-init="init()" :class="{ dark: darkMode }" class="flex h-screen overflow-hidden">

  <!-- Command palette (Ctrl+K) -->

      <div class="max-h-80 overflow-y-auto scrollbar-thin py-2">
        <template x-if="paletteResults().pages.length">
          <div class="px-2 mb-1">
            <p class="text-[10px] font-bold uppercase tracking-widest text-gray-500 px-2.5 py-1">Pages</p>

                <span x-text="r.label"></span>
              </button>
            </template>
          </div>
        </template>
        <template x-if="paletteResults().products.length">
          <div class="px-2">
            <p class="text-[10px] font-bold uppercase tracking-widest text-gray-500 px-2.5 py-1">Produits</p>
            <template x-for="(r, idx) in paletteResults().products" :key="'pr-'+r.id">
              <button @click="paletteGoTo(r)" @mouseenter="paletteIndex = paletteFlatIndex('product', idx)"

        <template x-if="!paletteResults().pages.length && !paletteResults().products.length">
          <p class="text-center text-sm text-gray-500 py-6">Aucun résultat pour « <span x-text="paletteQuery"></span> »</p>
        </template>
      </div>
    </div>
  </div>

  <!-- Focus Mode (double-clic sur une card graphique) -->
  <template x-if="focusMode">

      </button>

      <p class="px-3 pt-4 pb-1 text-[10px] font-bold uppercase tracking-wider text-gray-500">Pilotage</p>
      <button @click="page='analytics'" :class="page==='analytics' ? 'nav-active' : 'hover:bg-white/5 text-gray-300'" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition">
        <i class="fa-solid fa-chart-line w-4 text-center"></i> Analytics

<script>
function app() {
  // Kept outside Alpine's reactive data on purpose: Alpine deep-proxies everything
  // returned below, and Chart.js instances mutated inside the same x-init effect
  // (read + write on the same reactive prop) re-trigger that effect, recreating
  // charts on canvases that are still in use.
  let chartInstances = {};
  // Populated by mountCharts() — the raw config factories, kept so Focus Mode
  // can build a brand-new, uninstrumented config for the same chart instead of
  // reusing (and thereby corrupting) the live chart's already-resolved options.
  let chartDefs = {};
  return {
    page: 'dashboard',
    sidebarOpen: false,
    darkMode: (() => { try { return localStorage.getItem('etsydrop_dark') === '1'; } catch(e) { return false; } })(),

    // ===== Intégration API réelle (voir le <script> EDAPI dans <head>) =====
    // Renseignés par window._edPostAuth() une fois connecté — restent à leurs
    // valeurs par défaut (déconnecté, aucun email) tant que la session
    // Supabase locale n'est pas restaurée ou que le formulaire n'a pas validé.
    etsyConnected: false,
    currentUserEmail: null,
    etsyShopNameInput: '',

    // ===== Commandes (Etsy — flux de fulfillment) =====
    // Statut brut = valeur de l'enum OrderStatus (backend/models.py) — le
    // libellé/la couleur affichés viennent de orderStatusMeta() ci-dessous,
    // partagée entre les données de démo et les commandes réelles chargées
    // par window._edPostAuth().
    orders: [
      { id:'#EY-88213', customer:'Claire M.', product:'Collier prénom "Emma"', supplier:'Mon catalogue', amount:24.90, status:'delivered', tracking:'FR..8823JT' },
      { id:'#EY-88214', customer:'Julien P.', product:'Bracelet initiales "J&L"', supplier:'Mon catalogue', amount:18.90, status:'in_transit', tracking:'FR..2291KX' },
      { id:'#EY-88215', customer:'Sarah T.', product:'Bague prénom ajustable', supplier:'CJ Dropshipping', amount:20.40, status:'pending_supplier', tracking:'—' },
      { id:'#EY-88190', customer:'Marc D.', product:'Chaîne de cheville gravée', supplier:'CJ Dropshipping', amount:17.90, status:'delayed', tracking:'CN..7745QP' },
      { id:'#EY-88216', customer:'Léa B.', product:'Mug personnalisé prénom', supplier:'Printify', amount:19.90, status:'delivered', tracking:'FR..9013MZ' },
      { id:'#EY-88217', customer:'Thomas R.', product:"Boucles d'oreilles constellation", supplier:'Mon catalogue', amount:21.90, status:'in_transit', tracking:'FR..4471AL' },
      { id:'#EY-88180', customer:'Inès K.', product:'Collier zodiaque "Lion"', supplier:'Eprolo', amount:22.90, status:'return_requested', tracking:'FR..0032WD' }
    ],
    orderStatusMeta(status) {
      const map = {
        pending_supplier: { label: 'En attente fournisseur', pill: 'bg-amber-100 text-amber-700' },
        in_transit:       { label: 'En transit',             pill: 'bg-blue-50 text-blue-600' },
        delivered:        { label: 'Livrée',                 pill: 'bg-accent-light text-accent-dark' },
        delayed:          { label: 'Retard',                 pill: 'bg-rose-100 text-rose-600' },
        return_requested: { label: 'Retour demandé',         pill: 'bg-purple-100 text-purple-600' }
      };
      return map[status] || { label: status, pill: 'bg-gray-100 text-gray-600' };
    },
    orderRowClass(status) {
      if (status === 'delayed') return 'bg-rose-50/40';
      if (status === 'return_requested') return 'bg-purple-50/40';
      return '';
    },

    // ===== Command palette (Ctrl+K) =====
    paletteOpen: false,
    paletteQuery: '',
    paletteIndex: 0,
    paletteAllPages: [
      { type:'page', page:'dashboard', label:'Dashboard', icon:'fa-house' },
      { type:'page', page:'catalogue', label:'Catalogue', icon:'fa-swatchbook' },
      { type:'page', page:'sourcing', label:'Sourcing multi-sources', icon:'fa-layer-group' },
      { type:'page', page:'orders', label:'Commandes & Fulfillment', icon:'fa-truck-fast' },
      { type:'page', page:'mockups', label:'Mockups IA', icon:'fa-image' },
      { type:'page', page:'seo', label:'SEO & Mots-clés', icon:'fa-magnifying-glass' },
      { type:'page', page:'rank', label:'Rank Tracker', icon:'fa-ranking-star' },
      { type:'page', page:'competitors', label:'Analyse concurrents', icon:'fa-crosshairs' },
      { type:'page', page:'niches', label:'Niche Finder', icon:'fa-compass' },
      { type:'page', page:'promotion', label:'Promotion', icon:'fa-bullhorn' },
      { type:'page', page:'analytics', label:'Analytics', icon:'fa-chart-line' },
      { type:'page', page:'shipping', label:'Coûts & Expédition', icon:'fa-globe' },
      { type:'page', page:'taxes', label:'Taxes & Change', icon:'fa-landmark' },
      { type:'page', page:'ai', label:'Conseils IA', icon:'fa-robot' },
      { type:'page', page:'settings', label:'Intégrations & Paramètres', icon:'fa-gear' }
    ],
    paletteResults() {
      const q = this.paletteQuery.trim().toLowerCase();
      const pages = this.paletteAllPages.filter(p => !q || p.label.toLowerCase().includes(q)).slice(0, 8);
      const products = (this.catalogProducts || [])
        .filter(p => !q || p.name.toLowerCase().includes(q))
        .slice(0, 6)
        .map(p => ({ type: 'product', id: p.id, name: p.name, product: p }));
      return { pages, products };
    },
    paletteFlatList() {
      const r = this.paletteResults();
      return r.pages.concat(r.products);
    },
    paletteFlatIndex(section, idx) {
      if (section === 'page') return idx;
      return this.paletteResults().pages.length + idx;
    },
    paletteMoveDown() {
      const n = this.paletteFlatList().length;
      if (!n) return;
      this.paletteIndex = (this.paletteIndex + 1) % n;
    },
    paletteMoveUp() {
      const n = this.paletteFlatList().length;
      if (!n) return;
      this.paletteIndex = (this.paletteIndex - 1 + n) % n;
    },
    paletteSelect() {
      const item = this.paletteFlatList()[this.paletteIndex];
      if (item) this.paletteGoTo(item);
    },
    paletteGoTo(item) {
      if (item.type === 'page') {
        this.page = item.page;
      } else if (item.type === 'product') {
        this.page = 'catalogue';
        this.$nextTick(() => this.openProductModal(item.product));
      }
      this.paletteOpen = false;
      this.paletteQuery = '';
      this.paletteIndex = 0;
    },

    // ===== Focus Mode (double-clic sur une card graphique) =====
    focusMode: false,
    focusChartId: null,
    focusChartTitles: {

      const step = (now) => {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        this.revenueDisplay = from + (to - from) * eased;
        if (t < 1) requestAnimationFrame(step);

      };
      requestAnimationFrame(step);

        const price = (sellerCost + 0.20) / (1 - 0.065 - changePct - targetMargin);

        const marginEur = price - sellerCost - etsyFee - changeFee;
        const marginPct = price > 0 ? (marginEur / price) * 100 : 0;

    lqsChecks: [

        { status: 'ok', text: '70+ caractères' },
        { status: 'ok', text: 'Mot-clé principal présent' },
        { status: 'warning', text: 'Légère redondance détectée' }
      ]},
      { section: 'Description', items: [
        { status: 'ok', text: '160+ caractères' },
        { status: 'ok', text: 'Mot-clé dans la description' },
        { status: 'ok', text: 'Structure avec bullet points' }
      ]},
      { section: 'Tags', items: [
        { status: 'warning', text: '10/13 tags utilisés' },
        { status: 'ok', text: 'Tags diversifiés' },
        { status: 'ok', text: 'Pas de répétition avec le titre' }
      ]}
    ],
    lqsColor(score) {
      if (score < 50) return '#F43F5E';
      if (score < 70) return '#F59E0B';
      return '#00C896';
    },
    lqsArcOffset(score) {
      const circumference = Math.PI * 80;
      return circumference - (Math.max(0, Math.min(100, score)) / 100) * circumference;
    },

    // ===== Shop Analyzer (competitors page) =====
    analyzerFollowing: false,
    analyzerRange: '12m',
    analyzerData: {
      '12m': {
        labels: ['Oct','Nov','Déc','Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sept'],
        values: [612000,634000,655000,671000,698000,705000,722000,741000,758000,770000,781000,789508]
      },
      all: {
        labels: ['2015','2016','2017','2018','2019','2020','2021','2022','2023','2024','2025','2026'],
        values: [1200000,3400000,6800000,11500000,17900000,26200000,36800000,48500000,60100000,70800000,80200000,87360242]
      }
    },
    setAnalyzerRange(range) {
      this.analyzerRange = range;
      const ch = chartInstances['chartCompetitorRevenue'];
      if (!ch) return;
      const d = this.analyzerData[range];
      ch.data.labels = d.labels;
      ch.data.datasets[0].data = d.values;
      ch.update();
    },
    analyzerListings: [
      { title:'Dainty Initial Necklace', image:'https://picsum.photos/seed/analyzer1/64', sales:3240, revenue:58320, favorites:89400 },
      { title:'Custom Name Necklace', image:'https://picsum.photos/seed/analyzer2/64', sales:2910, revenue:63690, favorites:76200 },
      { title:'Layered Necklace Set', image:'https://picsum.photos/seed/analyzer3/64', sales:2540, revenue:91440, favorites:54800 },
      { title:'Tiny Heart Necklace', image:'https://picsum.photos/seed/analyzer4/64', sales:2180, revenue:32700, favorites:61300 },
      { title:'Birthstone Ring', image:'https://picsum.photos/seed/analyzer5/64', sales:1860, revenue:44640, favorites:39900 }
    ],

    calc: { cost: 4.20, shipping: 1.80, price: 24.90, etsyFee: 0, marginEur: 0, marginPct: 0, recommendedPrice: 0 },
    confettiShown: false,
    computeCalc() {
      const c = this.calc;
      c.etsyFee = c.price * 0.065 + 0.20;
      c.marginEur = c.price - c.cost - c.shipping - c.etsyFee;
      c.marginPct = c.price > 0 ? (c.marginEur / c.price) * 100 : 0;
      const base = c.cost + c.shipping;
      c.recommendedPrice = (base + 0.20) / (1 - 0.065 - 0.35);
      if (this.promo.pct !== null) this.simulatePromo(this.promo.pct);
      if (c.marginPct > 40 && this.confettiShown === false) {
        this.confettiShown = true;
        if (window.confetti) {
          confetti({ particleCount: 120, spread: 70, colors: ['#00C896', '#ffffff', '#1B1F27'], origin: { y: 0.6 } });
        }
      }
    },
    // ===== Promotion simulator (shipping page) =====
    promo: { pct: null, price: 0, marginEur: 0, marginPct: 0 },
    simulatePromo(pct) {
      const c = this.calc;
      this.promo.pct = pct;
      const price = c.price * (1 - pct / 100);
      const etsyFee = price * 0.065 + 0.20;
      const marginEur = price - c.cost - c.shipping - etsyFee;
      const marginPct = price > 0 ? (marginEur / price) * 100 : 0;
      this.promo.price = price;
      this.promo.marginEur = marginEur;
      this.promo.marginPct = marginPct;
    },
    promoMarginClass() {
      if (this.promo.marginPct >= 25) return 'text-accent-dark';
      if (this.promo.marginPct >= 15) return 'text-amber-600';
      return 'text-rose-500';
    },
    // Chart canvases live inside x-if templates, so most of them don't exist in the
    // DOM until the user navigates to that page. Charts are therefore built lazily
    // (on init + on every page change) rather than all at once.
    mountCharts() {
      const accent = '#00C896', ink = '#262B35', blue = '#4C6FFF', amber = '#F5A623', rose = '#F43F5E', purple = '#8B5CF6';
      const months = ['Avr','Mai','Juin','Juil','Août','Sept'];
      const fullMonths = ['Oct','Nov','Déc','Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sept'];

      const defs = {
        chartRevenue: () => ({
          type: 'line',
          data: { labels: months, datasets: [
            { label:'Revenu', data:[5200,6100,6800,7300,7950,8432], borderColor: accent, backgroundColor:'rgba(0,200,150,0.08)', fill:true, tension:0.4, borderWidth:2.5, pointRadius:0, pointHoverRadius:5, pointHoverBackgroundColor:accent },
            { label:'Bénéfice', data:[2050,2450,2740,2960,3260,3524], borderColor: ink, backgroundColor:'transparent', tension:0.4, borderWidth:2.5, pointRadius:0, pointHoverRadius:5, pointHoverBackgroundColor:ink }
          ]},
          options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#F1F2F4'}, ticks:{callback:v=>v+' €'}}, x:{grid:{display:false}} } }
        }),
        chartOrdersStatus: () => ({
          type: 'doughnut',
          data: { labels:['Livrées','En transit','En attente','Retard'], datasets:[{ data:[276,48,12,6], backgroundColor:[accent, blue, amber, rose], borderWidth:0 }] },
          options: { cutout:'72%', plugins:{legend:{display:false}} }
        }),
        chartAnalyticsMain: () => ({
          type: 'line',
          data: { labels: fullMonths, datasets: [
            { label:'Revenu', data:[3800,4200,4600,5100,5600,5200,6100,6800,7300,7950,8100,8432], borderColor: accent, backgroundColor:'rgba(0,200,150,0.08)', fill:true, tension:0.4, borderWidth:2.5, pointRadius:0, pointHoverRadius:5, pointHoverBackgroundColor:accent },
            { label:'Bénéfice net', data:[1500,1680,1840,2040,2260,2050,2450,2740,2960,3260,3380,3524], borderColor: ink, tension:0.4, borderWidth:2.5, pointRadius:0, pointHoverRadius:5, pointHoverBackgroundColor:ink }
          ]},
          options: { plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}}, scales:{ y:{grid:{color:'#F1F2F4'}}, x:{grid:{display:false}} } }
        }),
        chartTraffic: () => ({
          type: 'doughnut',
          data: { labels:['Recherche Etsy','Pinterest','Instagram','Direct','TikTok'], datasets:[{ data:[48,22,14,10,6], backgroundColor:[accent, rose, '#E1306C', ink, '#111827'], borderWidth:0 }] },
          options: { cutout:'72%', plugins:{legend:{position:'bottom', labels:{boxWidth:8, font:{size:10}}}} }
        }),
        chartSupplierCost: () => ({
          type: 'bar',
          data: { labels:['Mon cat.','Eprolo','CJ','Printify','Zendrop'], datasets:[{ data:[4.1,5.3,4.9,7.9,5.6], backgroundColor:[accent, blue, purple, amber, '#F5A623'], borderRadius:6 }] },
          options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#F1F2F4'}, ticks:{callback:v=>v+' €'}}, x:{grid:{display:false}} } }
        }),
        chartRank: () => ({
          type: 'line',
          data: { labels:['S1','S2','S3','S4','S5','S6','S7','S8'], datasets:[{ label:'Position', data:[14,12,10,9,7,5,4,3], borderColor: accent, backgroundColor:'rgba(0,200,150,0.08)', fill:true, tension:0.4, borderWidth:2.5, pointRadius:0, pointHoverRadius:5, pointHoverBackgroundColor:accent }] },
          options: { plugins:{legend:{display:false}}, scales:{ y:{reverse:true, min:1, max:16, grid:{color:'#F1F2F4'}, ticks:{callback:v=>'#'+v}}, x:{grid:{display:false}} } }
        }),
        chartCompetitorRevenue: () => ({
          type: 'line',
          data: { labels: this.analyzerRange==='12m' ? this.analyzerData['12m'].labels : this.analyzerData.all.labels,
                   datasets: [{ label:'Revenu', data: this.analyzerRange==='12m' ? this.analyzerData['12m'].values : this.analyzerData.all.values, borderColor: accent, backgroundColor:'rgba(0,200,150,0.08)', fill:true, tension:0.4, borderWidth:2.5, pointRadius:0, pointHoverRadius:5, pointHoverBackgroundColor:accent }] },
          options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#F1F2F4'}, ticks:{callback:v=>(v/1000)+'k $'}}, x:{grid:{display:false}} } }
        })
      };

      chartDefs = defs;

      Object.keys(defs).forEach(id => {
        if (chartInstances[id]) return;
        const canvas = document.getElementById(id);
        if (!canvas) return;
        chartInstances[id] = new Chart(canvas, defs[id]());
      });

      if (this.darkMode) this.applyChartTheme();
    },
    init() {
      this.computeCalc();
      this.$watch('calc.cost', () => this.computeCalc());
      this.$watch('calc.shipping', () => this.computeCalc());
      this.$watch('calc.price', () => this.computeCalc());
      this.$watch('page', () => this.$nextTick(() => this.mountCharts()));
      this.$nextTick(() => this.mountCharts());

      // Command palette
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          this.paletteOpen = true;
        }
      });
      this.$watch('paletteOpen', open => {
        if (open) {
          this.paletteIndex = 0;
          this.$nextTick(() => this.$refs.paletteInput && this.$refs.paletteInput.focus());
        } else {
          this.paletteQuery = '';
          this.paletteIndex = 0;
        }
      });
      this.$watch('paletteQuery', () => { this.paletteIndex = 0; });

      // Live revenue ticker
      this.startRevenueTicker();
    }
  }
}
</script>
</body>
