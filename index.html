<!DOCTYPE html>

<meta charset="UTF-8">
<script>
/* ============================================================
   EtsyDrop — Couche d'intégration API réelle
   Backend: https://etsydrop-backend-production.up.railway.app
   Auth: Supabase (wlqzhoixoxrtueldsqkv)

   Corrections apportées au script d'origine (commit "Add EtsyDrop API
   integration script") : plusieurs endpoints étaient appelés avec la
   mauvaise méthode HTTP ou les mauvais noms de champs/paramètres par
   rapport aux routers FastAPI réels (backend/routers/*.py), et les
   données chargées étaient écrites sur des propriétés Alpine qui
   n'existaient dans aucun template (donc jamais affichées).
   ============================================================ */
(function () {
  'use strict';

  // En dev local (Live Server / http.server sur localhost), on cible le
  // backend uvicorn local (voir CORS FRONTEND_ORIGIN_LOCAL dans main.py) ;
  // partout ailleurs, l'API Railway de production.
  const _isLocalDev = ['localhost', '127.0.0.1'].includes(window.location.hostname);
  const BACKEND   = _isLocalDev ? 'http://localhost:8000' : 'https://etsydrop-backend-production.up.railway.app';
  const SB_URL    = 'https://wlqzhoixoxrtueldsqkv.supabase.co';
  const SB_KEY    = 'sb_publishable_M-2zNvOpk644GMzrC_-k-g_kSR83Mun';

  /* ---- Session ---- */
  let _session = null;

  function _saveSession(s) {
    _session = s;
    try { sessionStorage.setItem('ed_session', JSON.stringify(s)); } catch(e) {}
  }

  function _restoreSession() {
    try {
      const raw = sessionStorage.getItem('ed_session');
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s.expires_at && Date.now() / 1000 > s.expires_at - 60) {
        sessionStorage.removeItem('ed_session');
      } else {
        _session = s;
      }
    } catch(e) {}
  }

  /* ---- Supabase auth ---- */
  async function _sbFetch(path, opts = {}) {
    const res = await fetch(SB_URL + path, {
      ...opts,
      headers: {
        apikey: SB_KEY,
        'Content-Type': 'application/json',
        ...(opts.headers || {})
      }
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error_description || json.error_code || json.message || 'Supabase error ' + res.status);
    return json;
  }

  async function signIn(email, password) {
    const data = await _sbFetch('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    _saveSession(data);
    return data;
  }

  async function signUp(email, password) {
    const data = await _sbFetch('/auth/v1/signup', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    if (data.access_token) _saveSession(data);
    return data;
  }

  async function signOut() {
    if (_session?.access_token) {
      await _sbFetch('/auth/v1/logout', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + _session.access_token }
      }).catch(() => {});
    }
    _session = null;
    try { sessionStorage.removeItem('ed_session'); } catch(e) {}
  }

  async function refreshToken() {
    if (!_session?.refresh_token) return null;
    try {
      const data = await _sbFetch('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        body: JSON.stringify({ refresh_token: _session.refresh_token })
      });
      _saveSession(data);
      return data;
    } catch(e) { return null; }
  }

  /* ---- Backend API ---- */
  async function api(path, opts = {}) {
    if (_session?.expires_at && Date.now() / 1000 > _session.expires_at - 120) {
      await refreshToken();
    }
    if (!_session?.access_token) throw new Error('Non authentifié');
    const res = await fetch(BACKEND + path, {
      ...opts,
      headers: {
        Authorization: 'Bearer ' + _session.access_token,
        'Content-Type': 'application/json',
        ...(opts.headers || {})
      }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'HTTP ' + res.status }));
      throw new Error(err.detail || 'API error ' + res.status);
    }
    // 204 No Content (DELETE fournisseur / produit / profil de livraison) :
    // pas de corps a parser.
    if (res.status === 204) return null;
    return res.json();
  }

  /* ---- Public API ----
     Chemins/méthodes/paramètres alignés sur les signatures réelles des
     routers FastAPI. Listings et Orders n'ont PAS de pagination côté API
     et renvoient un tableau JSON brut (pas de wrapper {items:[...]}).
     Sourcing/search et Shop/analyze sont en POST avec un body JSON. */
  window.EDAPI = {
    get session() { return _session; },
    get isLoggedIn() { return !!_session?.access_token; },
    signIn, signUp, signOut, refreshToken, restoreSession: _restoreSession,

    // Analytics
    summary:    ()             => api('/api/analytics/summary'),
    revenue:    (period)       => api('/api/analytics/revenue?period=' + (period || '30d')),
    margin:     (params)       => api('/api/analytics/margin?' + new URLSearchParams(params).toString()),

    // Listings
    listings:     (stockStatus) => api('/api/listings/' + (stockStatus ? '?stock_status=' + stockStatus : '')),
    listing:      (id)          => api('/api/listings/' + id),
    syncListings: ()            => api('/api/listings/sync', { method: 'POST' }),
    listingPricing: (id, d)     => api('/api/listings/' + id + '/pricing', { method: 'PATCH', body: JSON.stringify(d) }),

    // Orders
    orders:     ()             => api('/api/orders/'),
    order:      (id)           => api('/api/orders/' + id),
    fulfill:    (id, d)        => api('/api/orders/' + id + '/fulfill', { method:'POST', body:JSON.stringify(d) }),
    syncOrders: ()             => api('/api/orders/sync', { method: 'POST' }),

    // Etsy OAuth
    me:             ()  => api('/api/auth/me'),
    etsyLogin:      (shopName) => api('/api/auth/etsy/login?shop_name=' + encodeURIComponent(shopName)),
    etsyDisconnect: ()  => api('/api/auth/etsy/disconnect', { method:'DELETE' }),

    // Keywords / SEO
    keywords:   (q)            => api('/api/keywords/search?q=' + encodeURIComponent(q)),
    keywordMkt: (q, market)    => api('/api/keywords/market-search?q=' + encodeURIComponent(q) + (market ? '&market=' + market : '')),
    keywordDtl: (kw)           => api('/api/keywords/' + encodeURIComponent(kw)),

    // Sourcing
    sourcingSearch:  (query, countryCode) => api('/api/sourcing/search', { method:'POST', body: JSON.stringify({ query, country_code: countryCode }) }),
    sourcingCompare: (q)                  => api('/api/sourcing/compare?q=' + encodeURIComponent(q)),

    // Shop analyzer
    analyzeShop: (shopName)    => api('/api/shop/analyze', { method:'POST', body: JSON.stringify({ shop_name: shopName }) }),

    // AI generation
    genImage:   (d)            => api('/api/generate/image',   { method:'POST', body:JSON.stringify(d) }),
    genListing: (d)            => api('/api/generate/listing', { method:'POST', body:JSON.stringify(d) }),

    // Pricing
    calcPrice:  (d)            => api('/api/pricing/calculate', { method:'POST', body:JSON.stringify(d) }),

    // Promotion
    pinterest:  (d)            => api('/api/promotion/pinterest/publish', { method:'POST', body:JSON.stringify(d) }),

    // Ads
    adsSync:    (d)            => api('/api/ads/sync', { method:'POST', body: JSON.stringify(d) }),
    adsDash:    ()             => api('/api/ads/dashboard'),

    // Billing
    billingStatus:   ()        => api('/api/billing/status'),
    billingCheckout: (d)       => api('/api/billing/create-checkout', { method:'POST', body:JSON.stringify(d) }),

    // === PHASE 2 — Fournisseurs (backend/routers/suppliers.py) ===
    // api_key/api_secret : envoyes en creation/modification, jamais renvoyes
    // (models.Supplier n'expose que has_api_key).
    suppliers:                  ()             => api('/api/suppliers/'),
    supplierCreate:             (d)            => api('/api/suppliers/', { method:'POST', body:JSON.stringify(d) }),
    supplierUpdate:             (id, d)        => api('/api/suppliers/' + id, { method:'PATCH', body:JSON.stringify(d) }),
    supplierDelete:             (id)           => api('/api/suppliers/' + id, { method:'DELETE' }),
    supplierProducts:           (id)           => api('/api/suppliers/' + id + '/products'),
    supplierProductCreate:      (id, d)        => api('/api/suppliers/' + id + '/products', { method:'POST', body:JSON.stringify(d) }),
    supplierProductDelete:      (sid, pid)     => api('/api/suppliers/' + sid + '/products/' + pid, { method:'DELETE' }),
    supplierProductLink:        (pid, etsyId)  => api('/api/suppliers/products/' + pid + '/link', { method:'PATCH', body:JSON.stringify({ linked_etsy_listing_id: etsyId }) }),
    supplierImport:             (id)           => api('/api/suppliers/' + id + '/products/import', { method:'POST' }),
    supplierConversations:      ()             => api('/api/suppliers/conversations/'),
    supplierConversationCreate: (d)            => api('/api/suppliers/conversations/', { method:'POST', body:JSON.stringify(d) }),
    supplierConversationUpdate: (id, status)   => api('/api/suppliers/conversations/' + id, { method:'PATCH', body:JSON.stringify({ status }) }),

    // === PHASE 2 — Prix & livraison par pays (backend/routers/pricing.py) ===
    shippingProfiles:      ()                    => api('/api/pricing/profiles/'),
    shippingProfileCreate: (d)                   => api('/api/pricing/profiles/', { method:'POST', body:JSON.stringify(d) }),
    shippingProfileDelete: (id)                  => api('/api/pricing/profiles/' + id, { method:'DELETE' }),
    pricingAnalyze:        (d)                   => api('/api/pricing/analyze', { method:'POST', body:JSON.stringify(d) }),
    pricingApply:          (listingId, priceEur) => api('/api/pricing/apply/' + listingId, { method:'POST', body:JSON.stringify({ price_eur: priceEur }) }),

    // === PHASE 2 — SEO (backend/routers/seo.py) ===
    seoAnalyze:  (listingId)    => api('/api/seo/analyze/' + listingId),
    seoTrending: (params)       => api('/api/seo/keywords/trending?' + new URLSearchParams(params).toString()),
    seoOptimize: (listingId)    => api('/api/seo/optimize/' + listingId, { method:'POST' }),
    seoApply:    (listingId, d) => api('/api/seo/apply/' + listingId, { method:'POST', body:JSON.stringify(d) }),

    // === PHASE 2 — Test produit / simulation d'achat (backend/routers/product_test.py) ===
    productTestSimulate: (d)         => api('/api/product-test/simulate', { method:'POST', body:JSON.stringify(d) }),
    productTestResults:  (listingId) => api('/api/product-test/results/' + listingId),

    // === SOURCING ALIEXPRESS (backend/routers/aliexpress.py) — clés API côté serveur uniquement ===
    aliexpressSearch:  (q, page, limit) => api('/api/aliexpress/search?' + new URLSearchParams({ q, page: page || 1, limit: limit || 20 }).toString()),
    aliexpressProduct: (productId)      => api('/api/aliexpress/product/' + encodeURIComponent(productId)),
    aliexpressImport:  (d)              => api('/api/aliexpress/import', { method:'POST', body:JSON.stringify(d) }),
    // Produits fournisseur liés à une fiche Etsy (coût d'achat réel dans Coûts & Expédition)
    linkedSupplierProducts: ()          => api('/api/suppliers/products/linked'),

    // === DIAGNOSTIC CONNEXION ETSY (backend/routers/auth.py > /etsy/debug) ===
    etsyDebug: () => api('/api/auth/etsy/debug'),

    // Health
    health: () => fetch(BACKEND + '/api/health').then(r => r.json()),
  };

  /* ---- Login modal (injecté dans le DOM) ----
     Volontairement sans classes Tailwind dark: — le site gère le dark mode
     via des overrides .dark X sur les classes de base (voir <style> plus
     bas), donc bg-white/text-ink-900/input sont déjà stylés correctement
     dans les deux thèmes sans rien ajouter ici. */
  function injectLoginModal() {
    const modal = document.createElement('div');
    modal.id = 'ed-auth-modal';
    modal.innerHTML = `
      <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm" id="ed-auth-overlay">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-8">
          <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-accent flex items-center justify-center">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <div>
              <h1 class="text-xl font-bold text-ink-900">EtsyDrop</h1>
              <p class="text-xs text-gray-400">Dropshipping intelligent pour Etsy</p>
            </div>
          </div>
          <div id="ed-login-form">
            <h2 class="text-lg font-semibold text-ink-900 mb-1" id="ed-auth-title">Connexion</h2>
            <p class="text-sm text-gray-500 mb-5" id="ed-auth-sub">Connectez-vous pour accéder à votre tableau de bord</p>
            <div id="ed-auth-error" class="hidden mb-3 p-3 rounded-lg bg-rose-50 text-rose-600 text-sm"></div>
            <div class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="ed-email" class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm outline-none focus:border-accent" placeholder="vous@exemple.com">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input type="password" id="ed-password" class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm outline-none focus:border-accent" placeholder="••••••••">
              </div>
              <button id="ed-submit-btn" onclick="window._edAuthSubmit()" class="w-full py-2.5 px-4 bg-accent hover:bg-accent-dark text-ink-900 font-bold rounded-lg text-sm transition-colors">
                Se connecter
              </button>
            </div>
            <p class="mt-4 text-center text-sm text-gray-500">
              <span id="ed-toggle-text">Pas encore de compte ?</span>
              <button id="ed-toggle-btn" onclick="window._edToggleMode()" class="text-accent font-semibold hover:underline ml-1">S'inscrire</button>
            </p>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  window._edAuthMode = 'login';
  window._edToggleMode = function() {
    window._edAuthMode = window._edAuthMode === 'login' ? 'signup' : 'login';
    const isLogin = window._edAuthMode === 'login';
    document.getElementById('ed-auth-title').textContent = isLogin ? 'Connexion' : 'Créer un compte';
    document.getElementById('ed-auth-sub').textContent = isLogin
      ? 'Connectez-vous pour accéder à votre tableau de bord'
      : 'Créez votre compte EtsyDrop gratuitement';
    document.getElementById('ed-submit-btn').textContent = isLogin ? 'Se connecter' : 'Créer un compte';
    document.getElementById('ed-toggle-text').textContent = isLogin ? 'Pas encore de compte ?' : 'Déjà un compte ?';
    document.getElementById('ed-toggle-btn').textContent = isLogin ? "S'inscrire" : 'Se connecter';
  };

  window._edAuthSubmit = async function() {
    const email = document.getElementById('ed-email').value.trim();
    const password = document.getElementById('ed-password').value;
    const btn = document.getElementById('ed-submit-btn');
    const errEl = document.getElementById('ed-auth-error');
    if (!email || !password) { errEl.textContent = 'Remplissez tous les champs.'; errEl.classList.remove('hidden'); return; }
    btn.disabled = true;
    btn.textContent = 'Chargement…';
    errEl.classList.add('hidden');
    try {
      if (window._edAuthMode === 'login') {
        await window.EDAPI.signIn(email, password);
      } else {
        const res = await window.EDAPI.signUp(email, password);
        if (!res.access_token) {
          errEl.textContent = 'Vérifiez votre email pour confirmer votre inscription.';
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Créer un compte';
          return;
        }
      }
      document.getElementById('ed-auth-modal').remove();
      await window._edPostAuth();
    } catch(e) {
      errEl.textContent = e.message || 'Erreur. Réessayez.';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = window._edAuthMode === 'login' ? 'Se connecter' : 'Créer un compte';
    }
  };

  /* ---- Mappe une fiche produit backend (models.Listing) vers la forme
     attendue par catalogProducts (voir app() > Catalogue). Le backend ne
     fournit ni images ni comparatif fournisseurs : on utilise des visuels
     de substitution et un tableau suppliers vide plutôt que d'inventer des
     données. ---- */
  const STOCK_LABELS = { available: 'disponible', low_stock: 'stock_faible', out_of_stock: 'rupture' };
  const SUPPLIER_LABELS = {
    my_catalog: 'Mon catalogue', eprolo: 'Eprolo', cj_dropshipping: 'CJ Dropshipping',
    printify: 'Printify', printful: 'Printful', zendrop: 'Zendrop', aliexpress: 'AliExpress'
  };
  // Placeholder neutre (SVG inline) pour une fiche réelle sans image — jamais
  // une photo aléatoire (picsum) qui passerait pour un vrai visuel produit.
  const NO_IMAGE_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#F1F2F4"/><g fill="none" stroke="#C4C9D4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><rect x="110" y="120" width="180" height="160" rx="16"/><circle cx="160" cy="170" r="16"/><path d="M120 260l55-60 40 40 30-30 45 50"/></g><text x="200" y="330" text-anchor="middle" font-family="Inter, Arial" font-size="18" font-weight="600" fill="#9CA3AF">Image non disponible</text></svg>'
  );
  window.ED_NO_IMAGE = NO_IMAGE_SVG;

  // Résumé "Color: Gold, Silver / Size: S, M, L" depuis les variantes
  // structurées Etsy ({properties: {Color: 'Gold', Size: 'S'}}) — une entrée
  // par combinaison, on regroupe les valeurs distinctes par propriété.
  function _variantSummary(variants) {
    const byProp = {};
    (variants || []).forEach(v => {
      const props = v.properties || {};
      Object.keys(props).forEach(k => {
        if (!byProp[k]) byProp[k] = [];
        String(props[k]).split(',').map(s => s.trim()).filter(Boolean).forEach(val => {
          if (!byProp[k].includes(val)) byProp[k].push(val);
        });
      });
    });
    return Object.keys(byProp).map(k => k + ': ' + byProp[k].join(', ')).join(' / ');
  }

  function _mapListing(l) {
    // l.image_url : vraie image Etsy (voir etsy_client.py > fetch_listing_image_url).
    const realImage = l.image_url || null;
    const variants = l.variants || [];
    return {
      id: l.id,
      etsyListingId: l.etsy_listing_id || null,
      name: l.name,
      image: realImage || NO_IMAGE_SVG,
      images: [realImage || NO_IMAGE_SVG],
      variantsCount: variants.length,
      variantSummary: _variantSummary(variants),
      priceMin: l.price_min,
      priceMax: l.price_max,
      // Marge réelle uniquement si le coût fournisseur est connu (saisi à la
      // main) : (prix - coût - frais Etsy 6,5% - 0,20 €) / prix. Sinon null →
      // affiché "–", jamais un 0% qui ressemblerait à une vraie mesure.
      margin: (typeof l.cost_price === 'number' && l.price_min > 0)
        ? Math.round(((l.price_min - l.cost_price - l.price_min * 0.065 - 0.20) / l.price_min) * 100)
        : null,
      stock: STOCK_LABELS[l.stock_status] || 'disponible',
      supplier: SUPPLIER_LABELS[l.supplier] || l.supplier,
      // Coût fournisseur RÉEL saisi par l'utilisateur (listings.cost_price),
      // null tant qu'il n'est pas renseigné — le simulateur "Prix par pays"
      // l'exige plutôt que de prendre le prix de vente Etsy pour un coût.
      baseCost: (typeof l.cost_price === 'number') ? l.cost_price : null,
      costPrice: (typeof l.cost_price === 'number') ? l.cost_price : null,
      targetMargin: (typeof l.target_margin === 'number') ? l.target_margin : 35,
      freeShipping: false,
      description: l.description,
      tags: l.tags || [],
      // Forme brute conservée telle quelle : {label, price, quantity,
      // properties} pour une fiche importée depuis Etsy (propriétés
      // arbitraires — voir etsy_client.py > fetch_listing_variants), {color,
      // size, engraving, supplier_price} pour une fiche créée à la main.
      // app() > variantLabel() / variantPrice() gèrent les deux formes.
      variants,
      suppliers: []
    };
  }

  /* ---- Mappe une commande backend (models.Order) vers la forme attendue
     par le tableau Commandes (voir orders + orderStatusMeta() dans app()).
     `status` reste la valeur brute de l'enum OrderStatus : c'est
     orderStatusMeta() côté template qui la traduit en libellé/couleur. ---- */
  function _mapOrder(o) {
    const items = Array.isArray(o.items) ? o.items : [];
    const created = o.created_at ? new Date(o.created_at) : null;
    return {
      id: '#' + o.etsy_order_id,
      date: created && !isNaN(created) ? created.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '—',
      customer: o.customer_name,
      product: o.product_name,
      supplier: SUPPLIER_LABELS[o.supplier] || o.supplier,
      amount: (typeof o.total_price === 'number') ? o.total_price : o.amount,
      currency: o.currency || 'EUR',
      itemsCount: items.reduce((sum, it) => sum + (it.quantity || 1), 0) || (items.length || 1),
      status: o.status,
      etsyStatus: o.etsy_status || null,
      tracking: o.tracking_number || '—'
    };
  }

  /* ---- Post-auth : charge les vraies données dans l'état Alpine ---- */
  window._edPostAuth = async function() {
    const rootEl = document.querySelector('[x-data]');
    if (!rootEl || !window.Alpine) return;
    const state = window.Alpine.$data(rootEl);
    if (!state) return;

    state.currentUserEmail = _session?.user?.email || null;

    // Garde explicite : sans token de session, tout appel /api/... échouerait
    // de toute façon (voir api() > 'Non authentifié'), mais autant ne pas
    // tenter les requêtes du tout plutôt que les laisser échouer une à une.
    if (!_session?.access_token) {
      console.warn('[EtsyDrop] _edPostAuth() : pas de session active (sessionStorage.ed_session vide) — chargement des données réelles ignoré.');
      return;
    }

    try {
      const me = await window.EDAPI.me().catch(() => null);
      if (me) {
        state.etsyConnected = !!me.etsy_shop_connected;
        state.etsyShopName = me.etsy_shop_name || null;
      }

      // Phase 2 — fournisseurs et profils de livraison appartiennent a
      // l'utilisateur EtsyDrop, pas a la boutique Etsy : charges des qu'une
      // session existe, boutique connectee ou non. Chaque loader gere ses
      // propres erreurs (jamais bloquant pour le reste du chargement).
      state.loggedIn = true;
      if (typeof state.loadSuppliers === 'function') state.loadSuppliers();
      if (typeof state.loadShippingProfiles === 'function') state.loadShippingProfiles();
      if (typeof state.loadLinkedSupplierProducts === 'function') state.loadLinkedSupplierProducts();

      // Une fois la boutique connectée, les données réelles (même vides/à
      // zéro) DOIVENT remplacer les données de démo — sinon un échec d'appel
      // ou une boutique sans historique laisse les faux chiffres/produits de
      // démo affichés, indiscernables de vraies données pour l'utilisateur.
      // Avant connexion, les données de démo restent (aperçu du produit).
      if (me && me.etsy_shop_connected) {
        const listings = await window.EDAPI.listings().catch(() => null);
        state.catalogProducts = Array.isArray(listings) ? listings.map(_mapListing) : [];

        const orders = await window.EDAPI.orders().catch(() => null);
        state.orders = Array.isArray(orders) ? orders.map(_mapOrder) : [];
        state.ordersCount = Array.isArray(orders) ? orders.length : 0;

        // /api/analytics/revenue agrège la table `orders` (commandes Etsy
        // synchronisées en DB) — jamais de valeur en dur. revenue_net =
        // revenu moins frais Etsy uniquement (pas de coût fournisseur connu
        // pour une fiche importée) : ce n'est PAS un vrai bénéfice net, voir
        // le libellé "Revenu net (hors coûts fournisseur)".
        const revenue = await window.EDAPI.revenue('30d').catch(() => null);
        state.revenueTotal = revenue ? revenue.revenue_gross : 0;
        state.animateRevenue(0, state.revenueTotal, 900);
        state.netProfit = revenue ? revenue.revenue_net : 0;
        state.ordersCount = revenue ? revenue.orders_count : state.ordersCount;
        state.avgOrderValue = revenue ? revenue.avg_order_value : 0;
        state.topProductTitle = (revenue && revenue.top_products && revenue.top_products[0]) ? revenue.top_products[0].title : null;
        state.topProducts = (revenue && Array.isArray(revenue.top_products)) ? revenue.top_products : [];
        state.orderStatusBreakdown = (revenue && revenue.status_breakdown) ? revenue.status_breakdown : {};
        state.revenueHistory = (revenue && Array.isArray(revenue.history)) ? revenue.history : [];
        if (typeof state.refreshDataCharts === 'function') state.refreshDataCharts();
      }
    } catch(e) {
      console.warn('[EtsyDrop] Erreur chargement données:', e);
    }
  };

  /* ---- Déclenche _edPostAuth() une fois Alpine réellement prêt.
     Alpine (script `defer`, voir plus bas dans <head>) s'initialise et émet
     "alpine:initialized" AVANT que "DOMContentLoaded" ne se déclenche sur ce
     document (un script `defer` s'exécute après le parsing du DOM mais
     toujours avant DOMContentLoaded). Ce bloc-ci est un <script> NON deferré,
     exécuté pendant le parsing du <head> : le addEventListener('alpine:
     initialized', …) posé à l'intérieur du handler DOMContentLoaded arrivait
     donc TOUJOURS après que l'événement ait déjà été émis — l'écouteur
     n'était jamais déclenché, et _edPostAuth() ne tournait alors que sur le
     setTimeout(500ms) de secours après une redirection OAuth Etsy (jamais
     sur un rechargement de page normal, où catalogProducts/etsyConnected
     restaient bloqués sur leurs valeurs par défaut). Un polling court, sans
     dépendre d'un événement qui a pu déjà avoir eu lieu, est fiable dans les
     deux cas. ---- */
  function _runPostAuthWhenReady(attempt) {
    attempt = attempt || 0;
    let state = null;
    try {
      // Alpine.$data() lève une exception (pas juste undefined) tant que
      // l'élément [x-data] n'a pas encore été traité par Alpine — d'où le
      // try/catch, indispensable pour que le polling puisse réessayer au
      // lieu de planter dès la première tentative trop précoce.
      const rootEl = document.querySelector('[x-data]');
      state = (window.Alpine && rootEl) ? window.Alpine.$data(rootEl) : null;
    } catch (e) {
      state = null;
    }
    if (state) {
      window._edPostAuth();
    } else if (attempt < 50) {
      setTimeout(() => _runPostAuthWhenReady(attempt + 1), 100);
    } else {
      console.warn('[EtsyDrop] Alpine jamais prêt après 5s — _edPostAuth() abandonné.');
    }
  }

  /* ---- Bootstrap ---- */
  document.addEventListener('DOMContentLoaded', function () {
    _restoreSession();

    if (window.EDAPI.isLoggedIn) {
      _runPostAuthWhenReady();
    } else {
      injectLoginModal();
    }

    // Etsy redirige ici avec ?etsy_connected=true ou ?etsy_error=... une fois
    // l'échange terminé côté backend (voir routers/auth.py > /etsy/callback).
    const params = new URLSearchParams(window.location.search);
    if (params.get('etsy_connected') || params.get('etsy_error')) {
      window.history.replaceState({}, '', window.location.pathname);
    }
  });

  /* ---- Helpers exposés aux boutons du template ---- */
  window.edConnectEtsy = async function(shopName) {
    const name = (shopName || '').trim();
    if (!name) {
      alert('Indique le nom exact de ta boutique Etsy avant de te connecter.');
      return;
    }
    try {
      const data = await window.EDAPI.etsyLogin(name);
      if (data.authorize_url) window.location.href = data.authorize_url;
    } catch(e) {
      alert('Erreur Etsy : ' + e.message);
    }
  };

  window.edResyncEtsy = async function() {
    const rootEl = document.querySelector('[x-data]');
    const state = rootEl && window.Alpine ? window.Alpine.$data(rootEl) : null;
    if (state) state.etsyResyncing = true;
    try {
      // Les deux syncs sont indépendantes (fiches et commandes) : un échec de
      // l'une ne doit pas empêcher l'autre, ni empêcher de recharger l'état
      // (_edPostAuth) avec ce qui a effectivement été synchronisé.
      const [listingsResult, ordersResult] = await Promise.all([
        window.EDAPI.syncListings().catch((e) => ({ error: e.message })),
        window.EDAPI.syncOrders().catch((e) => ({ error: e.message })),
      ]);
      await window._edPostAuth();
      const parts = [];
      parts.push(listingsResult.error
        ? ('fiches : erreur (' + listingsResult.error + ')')
        : (listingsResult.synced + ' fiche(s) synchronisée(s) sur ' + listingsResult.received + ' reçue(s)' + (typeof listingsResult.with_image === 'number' ? ' (' + listingsResult.with_image + ' avec image, ' + listingsResult.with_variants + ' avec variantes)' : '')));
      // SyncResult.errors : raisons lisibles d'un compteur à 0 (token OAuth
      // expiré, aucune fiche active, rate limit…) — voir etsy_client.py.
      if (Array.isArray(listingsResult.errors) && listingsResult.errors.length) {
        parts.push('détails : ' + listingsResult.errors.join(' | '));
      }
      parts.push(ordersResult.error ? ('commandes : erreur (' + ordersResult.error + ')') : (ordersResult.synced + ' commande(s) synchronisée(s)'));
      alert('Resynchronisation Etsy : ' + parts.join(', '));
    } finally {
      if (state) state.etsyResyncing = false;
    }
  };

  window.edDisconnectEtsy = async function() {
    try {
      await window.EDAPI.etsyDisconnect();
      await window._edPostAuth();
    } catch(e) {
      alert('Erreur Etsy : ' + e.message);
    }
  };

  window.edLogout = async function() {
    await window.EDAPI.signOut();
    window.location.reload();
  };

})();
</script>

                  <span x-show="!sparkData[p.id]" class="text-xs text-gray-400" title="Non disponible via API Etsy">–</span>
                </div>
                <button @click="openProductModal(p)" class="mt-auto w-full bg-ink-900 hover:bg-ink-700 text-white text-xs font-semibold py-2 rounded-lg transition">Voir fiche complète</button>
              </div>
            </div>
          </template>
        </div>

        <!-- État vide réel : boutique connectée mais sans fiche importée
             (échec de sync ou boutique Etsy sans fiche active) — jamais de
             données de démo affichées une fois réellement connecté. -->
        <div x-show="etsyConnected && catalogProducts.length === 0" class="bg-white rounded-xl border border-gray-200 shadow-card p-10 text-center">
          <i class="fa-solid fa-box-open text-3xl text-gray-300 mb-3"></i>
          <p class="font-semibold text-sm text-ink-900 mb-1">Aucune fiche trouvée</p>
          <p class="text-xs text-gray-500 mb-4">Ta boutique Etsy est connectée mais aucune fiche active n'a pu être importée.</p>
          <button @click="page='settings'" class="bg-ink-900 hover:bg-ink-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Vérifier la connexion Etsy</button>
        </div>

        <!-- Modal fiche produit -->
        <template x-if="selectedProduct">
          <div @click="closeProductModal()" @keydown.escape.window="closeProductModal()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
            <div @click.stop class="bg-white rounded-2xl w-full max-w-4xl max-h-[92vh] overflow-y-auto scrollbar-thin">
              <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 sticky top-0 bg-white z-10">
                <h2 class="font-bold text-lg text-ink-900" x-text="selectedProduct.name"></h2>
                <button @click="closeProductModal()" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500"><i class="fa-solid fa-xmark"></i></button>
              </div>

              <div class="p-6 space-y-6">
                <!-- Galerie -->
                <div class="relative rounded-xl overflow-hidden bg-gray-100">
                  <img :src="selectedProduct.images[galleryIndex]" class="w-full h-80 object-cover">
                  <button x-show="selectedProduct.images.length > 1" @click="prevImage()" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 hover:bg-white flex items-center justify-center shadow"><i class="fa-solid fa-chevron-left"></i></button>
                  <button x-show="selectedProduct.images.length > 1" @click="nextImage()" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 hover:bg-white flex items-center justify-center shadow"><i class="fa-solid fa-chevron-right"></i></button>
                  <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">
                    <template x-for="(img, i) in selectedProduct.images" :key="i">
                      <button @click="galleryIndex = i" class="w-2 h-2 rounded-full" :class="galleryIndex===i ? 'bg-white' : 'bg-white/50'"></button>
                    </template>
                  </div>
                  <span class="absolute top-3 right-3 bg-black/50 text-white text-[11px] font-semibold px-2 py-0.5 rounded-full" x-text="(galleryIndex+1)+' / '+selectedProduct.images.length"></span>
                </div>

                <!-- Description + tags -->
                <div>
                  <h3 class="font-bold text-sm text-ink-900 mb-2">Description</h3>
                  <p class="text-sm text-gray-600 leading-relaxed" x-text="selectedProduct.description"></p>
                  <h4 class="font-bold text-xs text-ink-900 mt-4 mb-2" x-text="selectedProduct.tags.length + ' tags Etsy'"></h4>
                  <div class="flex flex-wrap gap-1.5">
                    <template x-for="t in selectedProduct.tags" :key="t">
                      <span class="tag-pill bg-gray-100 text-gray-700" x-text="t"></span>
                    </template>
                  </div>
                </div>

                <!-- Listing Quality Score -->
                <div class="border border-gray-100 rounded-xl p-4">
                  <div class="flex items-center justify-between gap-2">
                    <h3 class="font-bold text-sm text-ink-900">Listing Quality Score</h3>
                    <!-- PHASE 2 : analyse serveur (/api/seo/analyze) pour une fiche réelle, exemple sinon -->
                    <span x-show="modalSeo" class="tag-pill bg-accent-light text-accent-dark"><i class="fa-solid fa-server"></i> Analyse réelle</span>
                    <span x-show="!modalSeo && !modalSeoLoading" class="tag-pill bg-gray-100 text-gray-700" x-text="isRealListing(selectedProduct) ? 'Estimation' : 'Exemple'"></span>
                  </div>
                  <p class="text-xs text-gray-500 mb-3" x-text="selectedProduct.name"></p>
                  <p x-show="modalSeoError" class="text-xs text-rose-500 mb-2" x-text="modalSeoError"></p>
                  <div x-show="modalSeoLoading" class="skeleton h-28 w-48 mx-auto rounded-xl mb-2"></div>

                  <div x-show="!modalSeoLoading" class="relative w-48 h-28 mx-auto mb-2">
                    <svg viewBox="0 0 200 110" class="w-full h-full">
                      <path class="lqs-bg" d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke-width="14" stroke-linecap="round"></path>
                      <path d="M20,100 A80,80 0 0,1 180,100" fill="none" :stroke="lqsColor(modalLqsScore())" stroke-width="14" stroke-linecap="round"
                            stroke-dasharray="251.33" :stroke-dashoffset="lqsArcOffset(modalLqsScore())" style="transition: stroke-dashoffset .6s ease, stroke .3s ease;"></path>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-end pb-1">
                      <span class="text-3xl font-extrabold text-ink-900 num" x-text="modalLqsScore()"></span>
                      <span class="text-[11px] text-gray-400 font-semibold">/ 100</span>
                    </div>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <template x-for="section in modalLqsChecks()" :key="section.section">
                      <div>
                        <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5"><span x-text="section.section"></span><span x-show="typeof section.score === 'number'" class="ml-1 num" x-text="'· ' + section.score + '/100'"></span></p>
                        <div class="space-y-1.5">
                          <template x-for="(item, i) in section.items" :key="i">
                            <div class="flex items-center gap-2 text-xs">
                              <i class="fa-solid" :class="item.status==='ok' ? 'fa-circle-check text-accent-dark' : (item.status==='warning' ? 'fa-triangle-exclamation text-amber-500' : 'fa-circle-xmark text-rose-500')"></i>
                              <span x-text="item.text"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div x-show="modalSeo && modalSeo.suggestions.length" class="mt-4 pt-3 border-t border-gray-100">
                    <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Suggestions</p>
                    <ul class="space-y-1">
                      <template x-for="s in (modalSeo ? modalSeo.suggestions : [])" :key="s"><li class="text-xs text-gray-600 flex gap-2"><i class="fa-solid fa-arrow-right text-accent text-[10px] mt-1"></i><span x-text="s"></span></li></template>
                    </ul>
                  </div>
                </div>

                <!-- Variantes -->
                <div>
                  <div class="flex items-center justify-between gap-3 mb-2 flex-wrap">
                    <h3 class="font-bold text-sm text-ink-900" x-text="'Variantes (' + selectedProduct.variants.length + ')'"></h3>
                    <p x-show="selectedProduct.variantSummary" class="text-xs text-gray-500 truncate" :title="selectedProduct.variantSummary" x-text="selectedProduct.variantSummary"></p>
                  </div>
                  <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100"><th class="pb-2 font-semibold">Variante</th><th class="pb-2 font-semibold">Stock</th><th class="pb-2 font-semibold">Prix</th></tr></thead>
                    <tbody class="divide-y divide-gray-50">
                      <template x-for="(v, i) in selectedProduct.variants" :key="i">
                        <tr><td class="py-2" x-text="variantLabel(v)"></td><td x-text="v.quantity ?? '—'"></td><td class="font-semibold" x-text="variantPrice(v).toFixed(2)+' €'"></td></tr>
                      </template>
                      <tr x-show="!selectedProduct.variants.length"><td colspan="3" class="py-3 text-gray-400 text-center">Aucune variante</td></tr>
                    </tbody>
                  </table>
                  </div>
                </div>

                <!-- Prix par pays -->
                <div>
                  <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                    <div class="flex items-center gap-2">
                      <h3 class="font-bold text-sm text-ink-900">Prix par pays</h3>
                      <span x-show="!modalPricing" class="tag-pill bg-amber-100 text-amber-700 text-[10px]">Estimation — calculé, pas une donnée Etsy</span>
                      <span x-show="modalPricing" class="tag-pill bg-accent-light text-accent-dark text-[10px]"><i class="fa-solid fa-server"></i> Moteur réel (TVA, change, frais Etsy)</span>
                    </div>
                    <label class="flex items-center gap-2 text-xs font-semibold text-gray-600 cursor-pointer select-none">
                      <input type="checkbox" x-model="selectedProduct.freeShipping" @change="refreshModalPricing()" class="accent-accent w-4 h-4">
                      Livraison gratuite (inclut le port dans le prix)
                    </label>
                  </div>
                  <p class="text-xs text-gray-500 mb-3">Simulateur de prix de vente cible à partir de <strong>ton</strong> coût fournisseur et de ta marge cible — Etsy ne fournit ni coût d'achat ni prix réels par pays à une appli tierce.</p>

                  <!-- Coût fournisseur & marge cible : saisis à la main, sauvegardés
                       en DB (listings.cost_price / target_margin — PATCH
                       /api/listings/{id}/pricing) pour une fiche réelle ; en
                       mémoire seulement pour une fiche de démo. -->
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4 p-4 rounded-xl bg-gray-50 border border-gray-100">
                    <div>
                      <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Prix fournisseur (€)</label>
                      <input type="number" min="0" step="0.01" placeholder="ex. 12,50"
                             :value="selectedProduct.costPrice ?? selectedProduct.baseCost ?? ''"
                             @input="selectedProduct.costPrice = $event.target.value === '' ? null : Math.max(0, parseFloat($event.target.value) || 0); selectedProduct.baseCost = selectedProduct.costPrice; pricingDirty = true"
                             class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent num">
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Marge cible (%)</label>
                      <input type="number" min="0" max="95" step="1"
                             :value="selectedProduct.targetMargin ?? 35"
                             @input="selectedProduct.targetMargin = Math.min(95, Math.max(0, parseFloat($event.target.value) || 0)); pricingDirty = true"
                             class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent num">
                    </div>
                    <div class="flex items-end">
                      <button @click="savePricing()" :disabled="!pricingDirty || pricingSaving"
                              class="w-full bg-ink-900 hover:bg-ink-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-semibold py-2.5 rounded-lg transition">
                        <i class="fa-solid mr-1.5" :class="pricingSaving ? 'fa-spinner fa-spin' : (pricingSaved ? 'fa-check' : 'fa-floppy-disk')"></i>
                        <span x-text="pricingSaving ? 'Enregistrement…' : (pricingSaved ? 'Enregistré' : 'Enregistrer')"></span>
                      </button>
                    </div>
                    <p x-show="pricingError" class="sm:col-span-3 text-xs text-rose-500" x-text="pricingError"></p>
                  </div>

                  <!-- État vide : pas de coût fournisseur → pas de simulation
                       (on ne prend jamais le prix de vente Etsy pour un coût). -->
                  <template x-if="!hasCostPrice()">
                  <div class="border border-dashed border-gray-200 rounded-xl p-6 text-center">
                    <i class="fa-solid fa-calculator text-2xl text-gray-300 mb-2 block"></i>
                    <p class="text-sm font-semibold text-ink-900 mb-1">Renseigne ton prix fournisseur</p>
                    <p class="text-xs text-gray-500">Le simulateur calcule un prix de vente par pays dès que le coût d'achat est connu.</p>
                  </div>
                  </template>

                  <p x-show="modalPricingError" class="text-xs text-rose-500 mb-2" x-text="modalPricingError"></p>
                  <div x-show="hasCostPrice() && modalPricingLoading && !modalPricing" class="space-y-2"><div class="skeleton h-8 rounded-lg"></div><div class="skeleton h-8 rounded-lg"></div><div class="skeleton h-8 rounded-lg"></div></div>

                  <!-- === PHASE 2 — Analyse serveur (PricingAnalyzeResponse) === -->
                  <template x-if="hasCostPrice() && modalPricing">
                  <div class="space-y-3 fade-enter">
                    <div class="overflow-x-auto">
                    <table class="w-full text-sm min-w-[860px]">
                      <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100">
                        <th class="pb-2 font-semibold">Pays</th><th class="pb-2 font-semibold">Prix recommandé</th><th class="pb-2 font-semibold">TVA</th><th class="pb-2 font-semibold">Frais Etsy</th><th class="pb-2 font-semibold">Livraison</th><th class="pb-2 font-semibold">Change</th><th class="pb-2 font-semibold">Marge nette</th><th class="pb-2 font-semibold">Au prix actuel</th>
                      </tr></thead>
                      <tbody class="divide-y divide-gray-50">
                        <template x-for="r in modalPricing.results" :key="'mp-'+r.country_code">
                          <tr class="hover:bg-gray-50 transition">
                            <td class="py-2 font-medium" x-text="r.flag + ' ' + r.country_name"></td>
                            <td><span class="font-semibold num" x-text="fmtEur(r.recommended_price_eur)"></span><span x-show="r.currency !== 'EUR'" class="text-[11px] text-gray-400 ml-1" x-text="'≈ ' + fmtLocal(r.recommended_price_local, r.currency)"></span></td>
                            <td><span class="num" x-text="fmtEur(r.vat_eur)"></span><span class="block text-[10px] text-gray-400 leading-tight" x-text="r.vat_label"></span></td>
                            <td class="num" x-text="fmtEur(r.etsy_fees_eur)"></td>
                            <td x-text="r.shipping_charged_eur > 0 ? fmtEur(r.shipping_charged_eur) : 'Gratuite'"></td>
                            <td class="num" x-text="fmtEur(r.currency_fee_eur)"></td>
                            <td><span class="tag-pill" :class="marginStatusPill(r.reachable ? r.status : 'bad')" x-text="r.reachable ? fmtEur(r.margin_eur) + ' · ' + fmtPct(r.margin_pct) : 'Inatteignable'"></span></td>
                            <td class="num font-semibold" :class="marginStatusClass(typeof r.current_margin_pct === 'number' ? (r.current_margin_pct >= modalPricing.target_margin_pct ? 'good' : (r.current_margin_pct >= modalPricing.target_margin_pct - 10 ? 'close' : 'bad')) : 'unknown')" x-text="typeof r.current_margin_pct === 'number' ? fmtPct(r.current_margin_pct) : '—'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    </div>
                    <div class="flex items-center justify-between flex-wrap gap-3 p-4 rounded-xl border border-gray-100 bg-gray-50">
                      <div>
                        <p class="text-sm font-semibold text-ink-900">Prix unique conseillé : <span class="num" x-text="fmtEur(modalPricing.suggested_single_price_eur)"></span> <span class="text-xs font-normal text-gray-500">(actuel : <span class="num" x-text="fmtEur(selectedProduct.priceMin)"></span>)</span></p>
                        <p class="text-[11px] text-gray-400" x-text="modalPricing.worst_case ? 'Pire cas : ' + modalPricing.worst_case.flag + ' ' + modalPricing.worst_case.country_name + ' — ' + modalPricing.worst_case.reason : 'La marge cible tient dans tous les pays à ce prix.'"></p>
                        <p x-show="modalPricingApply.error" class="text-xs text-rose-500 mt-1" x-text="modalPricingApply.error"></p>
                        <p x-show="modalPricingApply.done" class="text-xs text-accent-dark mt-1" x-text="modalPricingApply.done ? 'Prix mis à jour sur Etsy (' + (modalPricingApply.done.method === 'inventory' ? modalPricingApply.done.offerings_updated + ' variante(s)' : 'fiche simple') + ').' : ''"></p>
                      </div>
                      <button @click="applyPriceOnEtsy(selectedProduct.id, modalPricing.suggested_single_price_eur, modalPricingApply)" :disabled="modalPricingApply.applying || !etsyConnected || !modalPricing.suggested_single_price_eur"
                              class="text-xs font-bold px-4 py-2 rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed"
                              :class="modalPricingApply.confirming ? 'bg-rose-500 text-white hover:bg-rose-600' : 'bg-ink-900 text-white hover:bg-ink-700'">
                        <i class="fa-solid mr-1.5" :class="modalPricingApply.applying ? 'fa-spinner fa-spin' : (modalPricingApply.confirming ? 'fa-triangle-exclamation' : 'fa-upload')"></i>
                        <span x-text="modalPricingApply.applying ? 'Mise à jour…' : (modalPricingApply.confirming ? 'Confirmer la modification sur Etsy' : 'Appliquer ce prix sur Etsy')"></span>
                      </button>
                    </div>
                  </div>
                  </template>

                  <!-- Estimation locale (fiche de démo, ou serveur indisponible) -->
                  <template x-if="hasCostPrice() && !modalPricing && !modalPricingLoading">
                  <div class="overflow-x-auto">
                  <table class="w-full text-sm min-w-[760px]">
                    <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100">
                      <th class="pb-2 font-semibold">Pays</th><th class="pb-2 font-semibold">Prix recommandé</th><th class="pb-2 font-semibold">TVA locale</th><th class="pb-2 font-semibold">Frais Etsy</th><th class="pb-2 font-semibold">Livraison</th><th class="pb-2 font-semibold">Frais de change (1,8%)</th><th class="pb-2 font-semibold">Marge nette réelle</th>
                    </tr></thead>
                    <tbody class="divide-y divide-gray-50">
                      <template x-for="row in countryPricingRows(selectedProduct)" :key="row.code">
                        <tr>
                          <td class="py-2 font-medium" x-text="row.flag+' '+row.name"></td>
                          <td class="font-semibold" x-text="row.price.toFixed(2)+' €'"></td>
                          <td x-text="row.vat"></td>
                          <td x-text="row.etsyFee.toFixed(2)+' €'"></td>
                          <td x-text="row.shipping==='Gratuite' ? 'Gratuite' : row.shipping.toFixed(2)+' €'"></td>
                          <td x-text="row.changeFee.toFixed(2)+' €'"></td>
                          <td class="font-bold" :class="row.marginPct>=25?'text-accent-dark':(row.marginPct>=15?'text-amber-600':'text-rose-500')" x-text="row.marginEur.toFixed(2)+' € ('+row.marginPct.toFixed(1)+'%)'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  </div>
                  </template>
                </div>

                <!-- === PHASE 2 — SIMULER UN ACHAT (/api/product-test/simulate) === -->
                <div class="border border-gray-100 rounded-xl p-4">
                  <div class="flex items-center justify-between gap-2 flex-wrap mb-1">
                    <h3 class="font-bold text-sm text-ink-900"><i class="fa-solid fa-flask text-accent mr-1.5"></i>Simuler un achat</h3>
                    <span class="tag-pill bg-gray-100 text-gray-700 text-[10px]">Aucune commande réelle n'est passée</span>
                  </div>
                  <p class="text-xs text-gray-500 mb-3">Ce que paie l'acheteur dans un pays donné, ce qu'Etsy retient et ce qu'il te reste — avec le profil d'expédition Etsy réel de la fiche quand il est disponible.</p>

                  <template x-if="!isRealListing(selectedProduct) || !loggedIn">
                    <div class="border border-dashed border-gray-200 rounded-xl p-5 text-center">
                      <i class="fa-solid fa-plug text-xl text-gray-300 mb-2 block"></i>
                      <p class="text-xs text-gray-500">Disponible pour les fiches importées depuis ta boutique Etsy connectée.</p>
                    </div>
                  </template>

                  <template x-if="isRealListing(selectedProduct) && loggedIn">
                    <div class="space-y-3">
                      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div>
                          <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Pays</label>
                          <select x-model="testForm.destination_country" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white">
                            <template x-for="c in testCountryOptions" :key="'tc-'+c.code"><option :value="c.code" :selected="c.code === testForm.destination_country" x-text="c.flag + ' ' + c.name"></option></template>
                          </select>
                        </div>
                        <div class="col-span-2">
                          <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Variante</label>
                          <select x-model="testForm.variant_selected" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white">
                            <option value="">Prix de base</option>
                            <template x-for="(v, i) in selectedProduct.variants" :key="'tv-'+i"><option :value="variantLabel(v)" x-text="variantLabel(v) + ' — ' + fmtEur(variantPrice(v))"></option></template>
                          </select>
                        </div>
                        <div>
                          <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Quantité</label>
                          <input type="number" min="1" max="100" x-model="testForm.quantity" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent num">
                        </div>
                      </div>
                      <div class="flex items-center justify-between flex-wrap gap-2">
                        <p x-show="testError" class="text-xs text-rose-500" x-text="testError"></p>
                        <button @click="runProductTest()" :disabled="testRunning" class="ml-auto bg-ink-900 hover:bg-ink-700 text-white text-xs font-bold px-4 py-2 rounded-lg disabled:opacity-40 transition">
                          <i class="fa-solid mr-1.5" :class="testRunning ? 'fa-spinner fa-spin' : 'fa-play'"></i><span x-text="testRunning ? 'Simulation…' : 'Lancer la simulation'"></span>
                        </button>
                      </div>

                      <template x-if="testResult">
                        <div class="rounded-xl bg-gray-50 border border-gray-100 p-4 fade-enter">
                          <div class="flex items-start justify-between gap-3 flex-wrap mb-3">
                            <div>
                              <p class="text-sm font-semibold text-ink-900" x-text="testResult.flag + ' ' + testResult.country_name + (testResult.variant_selected ? ' · ' + testResult.variant_selected : '') + (testResult.quantity > 1 ? ' · ×' + testResult.quantity : '')"></p>
                              <p class="text-[11px] text-gray-400"><span x-text="testResult.shipping_source === 'etsy_profile' ? 'Profil d\'expédition Etsy réel' : 'Livraison estimée (pas de profil Etsy)'"></span><span x-show="testResult.delivery_days_min != null" x-text="' · ' + testResult.delivery_days_min + '-' + testResult.delivery_days_max + ' j'"></span></p>
                            </div>
                            <span class="tag-pill" :class="marginStatusPill(testResult.status)" x-text="marginStatusLabel(testResult.status)"></span>
                          </div>
                          <div class="grid grid-cols-3 gap-3 mb-3">
                            <div><p class="text-[11px] font-bold uppercase tracking-widest text-gray-400">Acheteur paie</p><p class="text-lg font-extrabold text-ink-900 num" x-text="fmtEur(testResult.buyer_total_eur)"></p><p x-show="testResult.currency !== 'EUR'" class="text-[11px] text-gray-400" x-text="'≈ ' + fmtLocal(testResult.buyer_total_local, testResult.currency)"></p></div>
                            <div><p class="text-[11px] font-bold uppercase tracking-widest text-gray-400">Net vendeur</p><p class="text-lg font-extrabold text-ink-900 num" x-text="fmtEur(testResult.seller_net_eur)"></p></div>
                            <div><p class="text-[11px] font-bold uppercase tracking-widest text-gray-400">Marge</p><p class="text-lg font-extrabold num" :class="marginStatusClass(testResult.status)" x-text="typeof testResult.margin_pct === 'number' ? fmtEur(testResult.margin_eur) + ' · ' + fmtPct(testResult.margin_pct) : '—'"></p></div>
                          </div>
                          <div class="divide-y divide-gray-50 text-xs">
                            <template x-for="(ln, i) in testResult.lines" :key="'tl-'+i">
                              <div class="flex items-center justify-between py-1.5 gap-3">

                                <span class="num whitespace-nowrap" :class="testLineClass(ln.kind)" x-text="(ln.kind === 'fee' || ln.kind === 'cost' ? '− ' : '') + fmtEur(Math.abs(ln.amount_eur))"></span>
                              </div>
                            </template>
                          </div>
                          <ul x-show="testResult.warnings.length" class="mt-3 space-y-1">
                            <template x-for="w in testResult.warnings" :key="w"><li class="text-[11px] text-amber-700 flex gap-1.5"><i class="fa-solid fa-triangle-exclamation mt-0.5"></i><span x-text="w"></span></li></template>

                      </template>

                      <div x-show="testHistory.length">

                                  <td class="text-gray-500 truncate max-w-[160px]" x-text="h.variant_selected || 'Base'"></td>
                                  <td class="num" x-text="fmtEur(h.buyer_total_eur)"></td>
                                  <td class="num" x-text="fmtEur(h.seller_net_eur)"></td>
                                  <td class="num font-semibold" :class="marginStatusClass(h.status)" x-text="typeof h.margin_pct === 'number' ? fmtPct(h.margin_pct) : '—'"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- Fournisseurs -->
                <div>
                  <h3 class="font-bold text-sm text-ink-900 mb-2">Fournisseurs</h3>

                    <template x-for="s in selectedProduct.suppliers" :key="s.name">
                      <div class="border rounded-lg p-3" :class="s.available ? (s.name===selectedProduct.supplier ? 'border-accent bg-accent-light' : 'border-gray-200') : 'border-gray-100 opacity-40'">

                        <p class="text-xs text-gray-500 mt-1" x-text="s.available ? s.price.toFixed(2)+' € · '+s.delay : 'Non disponible'"></p>

                    </template>

                  <!-- Fiche importée d'Etsy : aucun fournisseur lié (section
                       Sourcing / coût de revient à venir). -->
                  <div x-show="!selectedProduct.suppliers.length" class="border border-dashed border-gray-200 rounded-xl p-5 text-center">
                    <i class="fa-solid fa-truck-ramp-box text-xl text-gray-300 mb-2 block"></i>

                    <button @click="closeProductModal(); page='sourcing'" class="bg-ink-900 hover:bg-ink-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Comparer des fournisseurs</button>
                  </div>
                </div>

                <!-- Générer fiche -->
                <div class="border-t border-gray-100 pt-5">
                  <div class="flex items-center gap-3 flex-wrap">
                    <!-- PHASE 2 : fiche réelle → /api/seo/optimize (IA Claude, repli heuristique), toujours en anglais -->
                    <button @click="generateListing()" :disabled="modalOptimizing" class="bg-accent hover:bg-accent-dark text-ink-900 font-bold text-sm px-4 py-2 rounded-lg disabled:opacity-40 transition"><i class="fa-solid mr-1.5" :class="modalOptimizing ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'"></i><span x-text="modalOptimizing ? 'Génération en cours…' : 'Générer fiche Etsy'"></span></button>
                    <span x-show="modalOptimized" class="tag-pill" :class="modalOptimized && modalOptimized.engine === 'claude' ? 'bg-purple-50 text-purple-600' : 'bg-gray-100 text-gray-700'" x-text="modalOptimized && modalOptimized.engine === 'claude' ? 'IA Claude · anglais' : 'Règles locales · anglais'"></span>
                    <button x-show="modalOptimized" @click="modalOptimized = null; generateListing()" class="text-xs font-semibold text-gray-600 hover:text-ink-900 transition"><i class="fa-solid fa-rotate mr-1"></i>Régénérer</button>
                  </div>
                  <p x-show="modalOptimizeError" class="text-xs text-rose-500 mt-2" x-text="modalOptimizeError"></p>
                  <div x-show="generatedListingVisible" x-cloak class="mt-4 space-y-3">
                    <div>
                      <p class="text-xs font-bold text-gray-500 mb-1">Titre <span class="num" x-text="'(' + (modalOptimized ? modalOptimized.title.length : generatedTitle(selectedProduct).length) + '/140)'"></span></p>
                      <p class="text-sm bg-gray-50 border border-gray-100 rounded-lg p-2.5" x-text="modalOptimized ? modalOptimized.title : generatedTitle(selectedProduct)"></p>
                    </div>
                    <div>
                      <p class="text-xs font-bold text-gray-500 mb-1">Description</p>
                      <p class="text-sm bg-gray-50 border border-gray-100 rounded-lg p-2.5 leading-relaxed whitespace-pre-line" x-text="modalOptimized ? modalOptimized.description : generatedDescription(selectedProduct)"></p>
                    </div>
                    <div>
                      <p class="text-xs font-bold text-gray-500 mb-1"><span class="num" x-text="generatedTags(selectedProduct).length"></span> tags</p>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-for="t in generatedTags(selectedProduct)" :key="'gen-'+t">
                          <span class="tag-pill bg-gray-100 text-gray-700" x-text="t"></span>
                        </template>
                      </div>
                    </div>
                    <ul x-show="modalOptimized && modalOptimized.notes.length" class="space-y-0.5"><template x-for="n in (modalOptimized ? modalOptimized.notes : [])" :key="'on-'+n"><li class="text-[11px] text-gray-400 flex gap-1.5"><i class="fa-solid fa-circle text-[4px] mt-1.5"></i><span x-text="n"></span></li></template></ul>
                    <template x-if="modalOptimized && isRealListing(selectedProduct)">
                      <div class="flex items-center justify-between flex-wrap gap-3 p-4 rounded-xl border border-gray-100 bg-gray-50">
                        <div>
                          <p class="text-sm font-semibold text-ink-900">Publier cette fiche sur Etsy</p>
                          <p class="text-[11px] text-gray-400">Remplace le titre, la description et les tags actuels de la fiche. Visible immédiatement par les acheteurs.</p>
                          <p x-show="modalSeoApply.error" class="text-xs text-rose-500 mt-1" x-text="modalSeoApply.error"></p>
                          <p x-show="modalSeoApply.done" class="text-xs text-accent-dark mt-1" x-text="modalSeoApply.done ? 'Fiche mise à jour : ' + modalSeoApply.done.updated_fields.join(', ') + '.' : ''"></p>
                        </div>
                        <button @click="applySeoOnEtsy(selectedProduct.id, modalOptimized, modalSeoApply, () => refreshModalSeo())" :disabled="modalSeoApply.applying || !etsyConnected"

                                :class="modalSeoApply.confirming ? 'bg-rose-500 text-white hover:bg-rose-600' : 'bg-ink-900 text-white hover:bg-ink-700'">
                          <i class="fa-solid mr-1.5" :class="modalSeoApply.applying ? 'fa-spinner fa-spin' : (modalSeoApply.confirming ? 'fa-triangle-exclamation' : 'fa-upload')"></i>
                          <span x-text="modalSeoApply.applying ? 'Mise à jour…' : (modalSeoApply.confirming ? 'Confirmer la publication sur Etsy' : 'Appliquer sur Etsy')"></span>
                        </button>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div></template>

      <!-- ================= SOURCING ================= -->
      <template x-if="page==='sourcing'"><div class="fade-enter space-y-6 max-w-7xl mx-auto">

        <div class="grid grid-cols-4 gap-4">

          <div class="bg-white rounded-xl border border-gray-200 shadow-card p-4"><p class="text-xs font-semibold text-gray-500 mb-1">Produits comparés</p><p class="text-2xl font-extrabold">1 284</p><p class="text-xs text-accent-dark font-semibold mt-1"><i class="fa-solid fa-arrow-up"></i> +142 vs mois dernier</p></div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-card p-4"><p class="text-xs font-semibold text-gray-500 mb-1">Marge moyenne</p><p class="text-2xl font-extrabold text-accent-dark">40,2%</p><p class="text-xs text-accent-dark font-semibold mt-1"><i class="fa-solid fa-arrow-up"></i> +0,8 pt vs mois dernier</p></div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-card p-4"><p class="text-xs font-semibold text-gray-500 mb-1">Alertes stock</p><p class="text-2xl font-extrabold text-rose-500">3</p><p class="text-xs text-rose-500 font-semibold mt-1"><i class="fa-solid fa-arrow-up"></i> +1 vs mois dernier</p></div>
        </div>

        <!-- === ONGLETS SOURCING : Mes fournisseurs | AliExpress === -->
        <div class="flex items-center gap-2 flex-wrap">
          <div class="flex bg-gray-100 rounded-lg p-0.5">
            <button @click="sourcingTab = 'suppliers'" class="text-xs font-semibold px-4 py-2 rounded-md transition" :class="sourcingTab === 'suppliers' ? 'bg-white shadow-card text-ink-900' : 'text-gray-600 hover:text-ink-900'"><i class="fa-solid fa-truck-ramp-box mr-1.5"></i>Mes fournisseurs</button>
            <button @click="sourcingTab = 'aliexpress'" class="text-xs font-semibold px-4 py-2 rounded-md transition" :class="sourcingTab === 'aliexpress' ? 'bg-white shadow-card text-ink-900' : 'text-gray-600 hover:text-ink-900'"><i class="fa-brands fa-alipay mr-1.5"></i>AliExpress</button>
          </div>
          <span x-show="sourcingTab === 'aliexpress' && aliSearch.source" class="tag-pill" :class="aliSearch.source === 'affiliate_api' ? 'bg-accent-light text-accent-dark' : 'bg-amber-100 text-amber-700'" x-text="aliSearch.source === 'affiliate_api' ? 'API officielle' : 'Mode repli (pages publiques)'"></span>
        </div>

        <!-- === SOURCING ALIEXPRESS (/api/aliexpress) === -->
        <div x-show="sourcingTab === 'aliexpress'" class="bg-white rounded-xl border border-gray-200 shadow-card p-5 space-y-4">
          <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
              <h3 class="font-bold text-sm text-ink-900">Rechercher sur AliExpress</h3>
              <p class="text-xs text-gray-500 mt-0.5">Prix en USD, note et ventes réelles. « Importer » ajoute le produit à ton fournisseur AliExpress (créé automatiquement) et peut le lier à une fiche Etsy.</p>
            </div>
          </div>
          <div class="flex gap-2 flex-wrap">
            <input type="text" x-model="aliSearch.query" @keydown.enter="runAliSearch(1)" maxlength="120" placeholder="ex. name necklace, mushroom lamp…" class="flex-1 min-w-[220px] border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent">
            <select x-model="aliSearch.listing_id" class="border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white max-w-[260px]">
              <option value="">Lier à une fiche Etsy (optionnel)</option>
              <template x-for="l in realListings()" :key="'ali-l-'+l.id"><option :value="l.id" x-text="l.name"></option></template>
            </select>
            <button @click="runAliSearch(1)" :disabled="aliSearch.loading || !loggedIn" class="bg-accent hover:bg-accent-dark text-ink-900 font-bold text-sm px-4 py-2 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed transition"><i class="fa-solid mr-1.5" :class="aliSearch.loading ? 'fa-spinner fa-spin' : 'fa-magnifying-glass'"></i>Rechercher</button>
          </div>
          <p x-show="aliSearch.error" class="text-xs text-rose-500" x-text="aliSearch.error"></p>
          <p x-show="aliSearch.notice" class="text-xs text-accent-dark bg-accent-light rounded-lg px-3 py-2" x-text="aliSearch.notice"></p>

          <div x-show="!loggedIn" class="border border-dashed border-gray-200 rounded-xl p-8 text-center">
            <i class="fa-solid fa-lock text-2xl text-gray-300 mb-2 block"></i>
            <p class="text-sm font-semibold text-ink-900 mb-1">Connecte-toi pour rechercher sur AliExpress</p>
            <p class="text-xs text-gray-500">Les appels passent par le backend EtsyDrop (aucune clé dans le navigateur).</p>
          </div>
          <div x-show="loggedIn && !aliSearch.loading && !aliSearch.results.length && !aliSearch.searched" class="border border-dashed border-gray-200 rounded-xl p-8 text-center">
            <i class="fa-solid fa-magnifying-glass text-2xl text-gray-300 mb-2 block"></i>
            <p class="text-sm font-semibold text-ink-900 mb-1">Trouve ton fournisseur</p>
            <p class="text-xs text-gray-500">Tape un produit en anglais pour comparer les prix d'achat AliExpress à tes prix Etsy.</p>
          </div>
          <div x-show="loggedIn && !aliSearch.loading && !aliSearch.results.length && aliSearch.searched" class="border border-dashed border-gray-200 rounded-xl p-8 text-center">
            <i class="fa-solid fa-box-open text-2xl text-gray-300 mb-2 block"></i>
            <p class="text-sm font-semibold text-ink-900 mb-1">Aucun résultat</p>
            <p class="text-xs text-gray-500">Essaie des mots plus génériques en anglais.</p>
          </div>
          <div x-show="aliSearch.loading" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-3">
            <template x-for="i in 5" :key="'ali-sk-'+i"><div class="skeleton h-56 rounded-xl"></div></template>
          </div>

          <template x-if="aliSearch.results.length && !aliSearch.loading">
            <div class="space-y-3 fade-enter">
              <p class="text-xs text-gray-500"><span class="num" x-text="aliSearch.total != null ? aliSearch.total.toLocaleString('fr-FR') : aliSearch.results.length"></span> résultat(s) pour « <span class="font-semibold text-ink-900" x-text="aliSearch.lastQuery"></span> » · page <span class="num" x-text="aliSearch.page"></span><span x-show="aliSearch.cached"> · cache</span></p>
              <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-3">
                <template x-for="p in aliSearch.results" :key="p.product_id">
                  <div class="border border-gray-100 rounded-xl overflow-hidden card-hover transition flex flex-col bg-white">
                    <button @click="openAliProduct(p)" class="block aspect-square bg-gray-100 overflow-hidden">
                      <img x-show="p.image_url" :src="p.image_url" :alt="p.title" loading="lazy" class="w-full h-full object-cover">
                    </button>
                    <div class="p-3 flex flex-col gap-1.5 flex-1">
                      <button @click="openAliProduct(p)" class="text-xs font-medium text-ink-900 text-left leading-snug line-clamp-2 hover:text-accent transition" :title="p.title" x-text="p.title"></button>
                      <div class="flex items-baseline gap-1.5">
                        <span class="text-base font-extrabold text-ink-900 num" x-text="p.price_usd != null ? '$' + p.price_usd.toFixed(2) : '—'"></span>
                        <span class="text-[11px] text-gray-400 num" x-text="p.price_usd != null ? '≈ ' + fmtEur(usdToEur(p.price_usd)) : ''"></span>
                      </div>
                      <div class="flex items-center gap-2 text-[11px] text-gray-500">
                        <span x-show="p.rating != null"><i class="fa-solid fa-star text-amber-500"></i> <span class="num" x-text="p.rating"></span></span>
                        <span x-show="p.orders_count != null" class="num" x-text="p.orders_count.toLocaleString('fr-FR') + ' vendus'"></span>
                      </div>
                      <button @click="importAliProduct(p)" :disabled="aliImporting === p.product_id" class="mt-auto w-full text-xs font-bold px-3 py-1.5 rounded-lg transition disabled:opacity-40" :class="aliImported[p.product_id] ? 'bg-accent-light text-accent-dark' : 'bg-ink-900 text-white hover:bg-ink-700'">
                        <i class="fa-solid mr-1" :class="aliImporting === p.product_id ? 'fa-spinner fa-spin' : (aliImported[p.product_id] ? 'fa-check' : 'fa-download')"></i><span x-text="aliImported[p.product_id] ? 'Importé' : 'Importer'"></span>
                      </button>
                    </div>
                  </div>
                </template>
              </div>
              <div class="flex items-center justify-between">
                <button @click="runAliSearch(aliSearch.page - 1)" :disabled="aliSearch.page <= 1 || aliSearch.loading" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 transition"><i class="fa-solid fa-chevron-left mr-1"></i>Précédent</button>
                <button @click="runAliSearch(aliSearch.page + 1)" :disabled="aliSearch.loading || aliSearch.results.length < aliSearch.limit" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 transition">Suivant<i class="fa-solid fa-chevron-right ml-1"></i></button>
              </div>
              <ul x-show="aliSearch.warnings.length" class="space-y-0.5"><template x-for="w in aliSearch.warnings" :key="w"><li class="text-[11px] text-gray-400 flex gap-1.5"><i class="fa-solid fa-circle-info mt-0.5"></i><span x-text="w"></span></li></template></ul>
            </div>
          </template>
        </div>

        <!-- Modal détail produit AliExpress -->
        <template x-if="aliDetail">
          <div @click="aliDetail = null" @keydown.escape.window="aliDetail = null" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
            <div @click.stop class="bg-white rounded-2xl w-full max-w-3xl max-h-[92vh] overflow-y-auto scrollbar-thin fade-enter">
              <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 sticky top-0 bg-white z-10 gap-3">
                <h2 class="font-bold text-base text-ink-900 leading-snug" x-text="aliDetail.title"></h2>
                <button @click="aliDetail = null" class="w-9 h-9 flex-shrink-0 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="rounded-xl bg-gray-100 overflow-hidden aspect-square"><img x-show="aliDetail.image_url" :src="aliDetail.image_url" :alt="aliDetail.title" class="w-full h-full object-cover"></div>
                <div class="space-y-4">
                  <div x-show="aliDetail.loading" class="space-y-2"><div class="skeleton h-6 rounded-lg"></div><div class="skeleton h-20 rounded-lg"></div></div>
                  <div class="flex items-baseline gap-2">
                    <span class="text-3xl font-extrabold text-ink-900 num" x-text="aliDetail.price_usd != null ? '$' + aliDetail.price_usd.toFixed(2) : '—'"></span>
                    <span class="text-sm text-gray-400 num" x-text="aliDetail.price_usd != null ? '≈ ' + fmtEur(usdToEur(aliDetail.price_usd)) : ''"></span>
                    <span x-show="aliDetail.original_price_usd && aliDetail.original_price_usd > (aliDetail.price_usd || 0)" class="text-xs text-gray-400 line-through num" x-text="aliDetail.original_price_usd ? '$' + aliDetail.original_price_usd.toFixed(2) : ''"></span>
                  </div>
                  <div class="flex items-center gap-3 text-xs text-gray-500">
                    <span x-show="aliDetail.rating != null"><i class="fa-solid fa-star text-amber-500"></i> <span class="num" x-text="aliDetail.rating"></span> / 5</span>
                    <span x-show="aliDetail.orders_count != null" class="num" x-text="aliDetail.orders_count.toLocaleString('fr-FR') + ' vendus'"></span>
                    <span x-show="aliDetail.store_name" x-text="aliDetail.store_name"></span>
                  </div>
                  <div x-show="aliDetail.variants && aliDetail.variants.length">
                    <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Variantes</p>

                  </div>
                  <div x-show="aliDetail.quantity_prices && aliDetail.quantity_prices.length > 1">

                      <button @click="supplierDetail.showProductForm = !supplierDetail.showProductForm" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-ink-900 text-white hover:bg-ink-700 transition"><i class="fa-solid mr-1" :class="supplierDetail.showProductForm ? 'fa-minus' : 'fa-plus'"></i>Ajouter à la main</button>

                  </div>

                  <!-- Formulaire d'ajout -->
                  <div x-show="supplierDetail.showProductForm" x-cloak class="p-4 rounded-xl bg-gray-50 border border-gray-100 grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="col-span-2">
                      <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Nom du produit</label>

                    </div>
                    <div>
                      <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Prix</label>
                      <div class="flex gap-1">
                        <input type="number" min="0" step="0.01" x-model="supplierDetail.productForm.base_price" placeholder="4,20" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white num">
                        <select x-model="supplierDetail.productForm.currency" class="border border-gray-200 rounded-lg px-2 py-2 text-sm outline-none focus:border-accent bg-white"><option>EUR</option><option>USD</option><option>CNY</option></select>
