                    </div>
                    <div>
                      <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Délai (jours)</label>
                      <input type="number" min="0" max="365" x-model="supplierDetail.productForm.lead_time_days" placeholder="10" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white num">
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">MOQ</label>
                      <input type="number" min="1" x-model="supplierDetail.productForm.moq" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white num">
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Poids (g)</label>
                      <input type="number" min="0" x-model="supplierDetail.productForm.weight_grams" placeholder="25" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white num">
                    </div>
                    <div class="col-span-2">
                      <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Fiche Etsy liée <span class="normal-case tracking-normal font-medium">(optionnel)</span></label>
                      <select x-model="supplierDetail.productForm.linked_etsy_listing_id" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white">
                        <option value="">— Aucune —</option>
                        <template x-for="l in realListings().filter(l => l.etsyListingId)" :key="'pf-'+l.id"><option :value="l.etsyListingId" x-text="l.name"></option></template>

                    </div>
                    <div class="col-span-2 sm:col-span-4 flex justify-end gap-2">
                      <button @click="supplierDetail.showProductForm = false" class="text-xs font-semibold px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 transition">Annuler</button>
                      <button @click="addSupplierProduct()" :disabled="supplierDetail.productSaving" class="text-xs font-bold px-4 py-2 rounded-lg bg-accent text-ink-900 hover:bg-accent-dark disabled:opacity-40 transition"><i class="fa-solid mr-1.5" :class="supplierDetail.productSaving ? 'fa-spinner fa-spin' : 'fa-plus'"></i>Ajouter le produit</button>
                    </div>
                  </div>

                  <!-- Chargement / vide / tableau -->
                  <div x-show="supplierDetail.loading" class="space-y-2"><div class="skeleton h-9 rounded-lg"></div><div class="skeleton h-9 rounded-lg"></div></div>
                  <div x-show="!supplierDetail.loading && !supplierDetail.products.length" class="border border-dashed border-gray-200 rounded-xl p-8 text-center">
                    <i class="fa-solid fa-box-open text-2xl text-gray-300 mb-2 block"></i>
                    <p class="text-sm font-semibold text-ink-900 mb-1">Aucun produit chez ce fournisseur</p>
                    <p class="text-xs text-gray-500">Importe le catalogue via l'API (Eprolo) ou ajoute un produit à la main pour suivre ses prix et le lier à une fiche Etsy.</p>
                  </div>
                  <div x-show="!supplierDetail.loading && supplierDetail.products.length" class="overflow-x-auto">
                    <table class="w-full text-sm min-w-[700px]">
                      <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100">
                        <th class="pb-2 font-semibold">Produit</th><th class="pb-2 font-semibold">Prix</th><th class="pb-2 font-semibold">MOQ</th><th class="pb-2 font-semibold">Délai</th><th class="pb-2 font-semibold">Fiche Etsy liée</th><th class="pb-2"></th>
                      </tr></thead>
                      <tbody class="divide-y divide-gray-50">
                        <template x-for="sp in supplierDetail.products" :key="sp.id">
                          <tr class="hover:bg-gray-50 transition">
                            <td class="py-2.5">
                              <div class="flex items-center gap-2">
                                <img x-show="sp.images && sp.images.length" :src="sp.images && sp.images[0]" class="w-8 h-8 rounded-lg object-cover bg-gray-100" alt="">
                                <div class="min-w-0"><p class="font-medium text-ink-900 truncate max-w-[260px]" x-text="sp.name"></p><p x-show="sp.supplier_product_id" class="text-[11px] text-gray-400" x-text="'Réf. ' + sp.supplier_product_id"></p></div>
                              </div>
                            </td>
                            <td class="font-semibold num" x-text="fmtLocal(sp.base_price, sp.currency)"></td>
                            <td class="num" x-text="sp.moq"></td>
                            <td x-text="sp.lead_time_days != null ? sp.lead_time_days + ' j' : '—'"></td>
                            <td>
                              <select :value="sp.linked_etsy_listing_id || ''" @change="linkSupplierProduct(sp, $event.target.value)" class="border border-gray-200 rounded-lg px-2 py-1 text-xs outline-none focus:border-accent bg-white max-w-[220px]">
                                <option value="">— Non liée —</option>
                                <template x-for="l in realListings().filter(l => l.etsyListingId)" :key="'lk-'+sp.id+'-'+l.id"><option :value="l.etsyListingId" :selected="String(l.etsyListingId) === String(sp.linked_etsy_listing_id || '')" x-text="l.name"></option></template>
                              </select>
                            </td>
                            <td class="text-right"><button @click="removeSupplierProduct(sp)" class="text-xs px-2.5 py-1 rounded-lg border border-gray-200 hover:bg-rose-50 hover:text-rose-500 transition" title="Supprimer"><i class="fa-solid fa-trash"></i></button></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>

                <!-- Onglet Messages -->
                <div x-show="supplierDetail.tab === 'messages'" x-cloak class="space-y-4">
                  <div class="p-4 rounded-xl bg-gray-50 border border-gray-100 space-y-3">
                    <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400">Poser une question / demander un devis</p>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div class="sm:col-span-2">
                        <input type="text" x-model="supplierDetail.msgForm.subject" maxlength="140" placeholder="Sujet — ex. Quote for 50 units, gold plated" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white">
                      </div>
                      <div>
                        <select x-model="supplierDetail.msgForm.supplier_product_id" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white">
                          <option value="">Produit concerné (optionnel)</option>
                          <template x-for="sp in supplierDetail.products" :key="'msg-'+sp.id"><option :value="sp.id" x-text="sp.name"></option></template>
                        </select>
                      </div>
                    </div>
                    <textarea x-model="supplierDetail.msgForm.message" rows="4" maxlength="4000" placeholder="Hello, could you confirm the unit price and lead time for…" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white resize-none"></textarea>
                    <div class="flex items-center justify-between flex-wrap gap-2">
                      <p class="text-[11px] text-gray-400"><i class="fa-regular fa-envelope mr-1"></i><span x-text="supplierDetail.supplier.contact_email ? 'Envoyé par email à ' + supplierDetail.supplier.contact_email + ' si le SMTP est configuré, sinon archivé ici.' : 'Aucun email de contact : le message sera archivé ici sans envoi.'"></span></p>
                      <button @click="sendSupplierMessage()" :disabled="supplierDetail.msgSending" class="text-xs font-bold px-4 py-2 rounded-lg bg-accent text-ink-900 hover:bg-accent-dark disabled:opacity-40 transition"><i class="fa-solid mr-1.5" :class="supplierDetail.msgSending ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>Envoyer</button>
                    </div>
                  </div>

                  <div x-show="!conversationsFor(supplierDetail.supplier.id).length" class="border border-dashed border-gray-200 rounded-xl p-8 text-center">
                    <i class="fa-regular fa-comments text-2xl text-gray-300 mb-2 block"></i>
                    <p class="text-sm font-semibold text-ink-900 mb-1">Aucun échange pour le moment</p>
                    <p class="text-xs text-gray-500">Tes questions et demandes de devis apparaîtront ici avec leur statut.</p>
                  </div>
                  <div class="space-y-2">
                    <template x-for="c in conversationsFor(supplierDetail.supplier.id)" :key="c.id">
                      <div class="border border-gray-100 rounded-xl p-4 hover:bg-gray-50 transition">
                        <div class="flex items-start justify-between gap-3 flex-wrap">
                          <div class="min-w-0">
                            <p class="text-sm font-semibold text-ink-900" x-text="c.subject"></p>
                            <p class="text-[11px] text-gray-400 mt-0.5"><span x-text="fmtDate(c.created_at)"></span> · <span x-text="c.direction === 'sent' ? 'Envoyé' : 'Reçu'"></span> · <span x-text="c.email_sent ? 'email parti' : 'archivé sans email'"></span></p>
                          </div>
                          <div class="flex items-center gap-1.5 flex-shrink-0">
                            <span class="tag-pill" :class="conversationStatusMeta(c.status).pill" x-text="conversationStatusMeta(c.status).label"></span>
                            <button x-show="c.status !== 'answered'" @click="setConversationStatus(c, 'answered')" class="text-[11px] font-semibold px-2 py-1 rounded-lg border border-gray-200 hover:bg-gray-50 transition" title="Marquer comme répondu">Répondu</button>
                            <button x-show="c.status !== 'closed'" @click="setConversationStatus(c, 'closed')" class="text-[11px] font-semibold px-2 py-1 rounded-lg border border-gray-200 hover:bg-gray-50 transition" title="Clore">Clore</button>
                            <button x-show="c.status === 'closed'" @click="setConversationStatus(c, 'open')" class="text-[11px] font-semibold px-2 py-1 rounded-lg border border-gray-200 hover:bg-gray-50 transition" title="Réouvrir">Réouvrir</button>
                          </div>
                        </div>
                        <p class="text-xs text-gray-600 mt-2 leading-relaxed whitespace-pre-line" x-text="c.message"></p>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div></template>

      <!-- ================= ORDERS ================= -->
      <template x-if="page==='orders'"><div class="fade-enter space-y-6 max-w-7xl mx-auto">

        <div class="grid grid-cols-5 gap-4">
          <!-- Le "342" de démo représente un volume mensuel plus riche que les
               7 lignes d'exemple listées plus bas — préservé tant que non
               connecté. Une fois connecté, ces cartes reflètent les vraies
               commandes importées (0 si aucune), jamais le chiffre de démo. -->
          <div class="bg-white rounded-xl border border-gray-200 shadow-card p-4"><p class="text-xs font-semibold text-gray-500 mb-1">Total (30j)</p><p class="text-xl font-extrabold" x-text="etsyConnected ? orders.length : 342"></p></div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-card p-4"><p class="text-xs font-semibold text-gray-500 mb-1">Auto-transmises</p><p class="text-xl font-extrabold text-accent-dark" x-text="etsyConnected ? orders.filter(o => o.status !== 'pending_supplier').length : 336"></p></div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-card p-4"><p class="text-xs font-semibold text-gray-500 mb-1">En attente fournisseur</p><p class="text-xl font-extrabold text-amber-500" x-text="etsyConnected ? orders.filter(o => o.status === 'pending_supplier').length : 12"></p></div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-card p-4"><p class="text-xs font-semibold text-gray-500 mb-1">Retards &gt;10j</p><p class="text-xl font-extrabold text-rose-500" x-text="etsyConnected ? orders.filter(o => o.status === 'delayed').length : 6"></p></div>
          <div class="bg-white rounded-xl border border-gray-200 shadow-card p-4"><p class="text-xs font-semibold text-gray-500 mb-1">Retours/SAV</p><p class="text-xl font-extrabold" x-text="etsyConnected ? orders.filter(o => o.status === 'return_requested').length : 4"></p></div>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-card">
          <div class="flex items-center justify-between p-5 pb-4">
            <h3 class="font-bold text-sm text-ink-900">Commandes Etsy — flux de fulfillment</h3>
            <div class="flex gap-2 text-xs font-semibold">
              <button class="px-3 py-1.5 rounded-lg bg-ink-900 text-white">Toutes</button>
              <button class="px-3 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50">En attente</button>
              <button class="px-3 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50">Retard</button>
            </div>
          </div>
          <div class="overflow-x-auto px-5 pb-5">
          <table class="w-full text-sm min-w-[920px]">
            <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100">
              <th class="pb-2 font-semibold">Commande</th><th class="pb-2 font-semibold">Date</th><th class="pb-2 font-semibold">Client</th><th class="pb-2 font-semibold">Produit</th><th class="pb-2 font-semibold">Articles</th><th class="pb-2 font-semibold">Fournisseur</th><th class="pb-2 font-semibold">Montant</th><th class="pb-2 font-semibold">Statut</th><th class="pb-2 font-semibold">Suivi</th>
            </tr></thead>
            <tbody class="divide-y divide-gray-50">
              <template x-for="o in orders" :key="o.id">
                <tr class="hover:bg-gray-50" :class="orderRowClass(o.status)">
                  <td class="py-3 font-medium whitespace-nowrap" x-text="o.id"></td>
                  <td class="text-gray-500 whitespace-nowrap" x-text="o.date || '—'"></td>
                  <td x-text="o.customer"></td>
                  <td class="max-w-[280px] truncate" :title="o.product" x-text="o.product"></td>
                  <td class="num" x-text="o.itemsCount ?? 1"></td>
                  <td x-text="o.supplier"></td>
                  <td class="font-semibold whitespace-nowrap num" x-text="formatRevenue(o.amount)"></td>
                  <td><span class="tag-pill" :class="orderStatusMeta(o.status).pill" x-text="orderStatusMeta(o.status).label"></span></td>
                  <td class="text-gray-400 font-mono text-xs" x-text="o.tracking"></td>
                </tr>
              </template>
              <!-- État vide réel : boutique connectée mais aucune commande
                   importée — jamais les 7 commandes de démo une fois
                   réellement connecté. -->
              <tr x-show="etsyConnected && orders.length === 0">
                <td colspan="9" class="py-10 text-center">
                  <i class="fa-solid fa-inbox text-3xl text-gray-300 mb-3 block"></i>
                  <p class="font-semibold text-sm text-ink-900 mb-1">Aucune commande trouvée</p>
                  <p class="text-xs text-gray-500">Ta boutique Etsy est connectée mais aucune commande n'a encore été synchronisée.</p>
                </td>
              </tr>
            </tbody>
          </table>
          </div>
        </div>
      </div></template>

      <!-- ================= SEO ================= -->
      <template x-if="page==='seo'"><div class="fade-enter space-y-6 max-w-7xl mx-auto">

        <div class="grid grid-cols-3 gap-4">
          <div class="col-span-2 bg-white rounded-xl border border-gray-200 shadow-card p-5">
            <h3 class="font-bold text-sm text-ink-900 mb-3">Recherche de mots-clés</h3>
            <div class="flex gap-2 mb-2">
              <input type="text" x-model="seoQuery" @keydown.enter="runSeoTrending()" maxlength="80" placeholder="personalized name necklace" class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent">
              <button @click="runSeoTrending()" :disabled="seoTrendingLoading" class="bg-accent text-ink-900 font-bold text-sm px-4 py-2 rounded-lg hover:bg-accent-dark disabled:opacity-40 transition"><i class="fa-solid mr-1.5" :class="seoTrendingLoading ? 'fa-spinner fa-spin' : 'fa-magnifying-glass'"></i>Analyser</button>
            </div>
            <p class="text-[11px] text-gray-400 mb-4">Requête en anglais (marché US/UK). Sources : catégories Etsy, tags de tes fiches, tags des fiches actives Etsy pour cette recherche.</p>
            <p x-show="seoTrendingError" class="text-xs text-rose-500 mb-3" x-text="seoTrendingError"></p>

            <!-- === PHASE 2 — Résultats réels (SeoTrendingResponse) === -->
            <div x-show="seoTrendingLoading" class="space-y-2"><div class="skeleton h-8 rounded-lg"></div><div class="skeleton h-8 rounded-lg"></div><div class="skeleton h-8 rounded-lg"></div></div>
            <template x-if="seoTrending && !seoTrendingLoading">
              <div class="fade-enter">
                <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                  <p class="text-xs text-gray-500">Résultats pour <span class="font-semibold text-ink-900" x-text="'« ' + seoTrending.query + ' »'"></span> · <span class="num" x-text="seoTrending.keywords.length"></span> mot(s)-clé(s)</p>
                  <button @click="seoTrending = null" class="text-[11px] font-semibold text-gray-500 hover:text-ink-900 transition"><i class="fa-solid fa-xmark mr-1"></i>Effacer</button>
                </div>
                <div x-show="!seoTrending.keywords.length" class="border border-dashed border-gray-200 rounded-xl p-8 text-center">
                  <i class="fa-solid fa-tags text-2xl text-gray-300 mb-2 block"></i>
                  <p class="text-sm font-semibold text-ink-900 mb-1">Aucun mot-clé trouvé</p>
                  <p class="text-xs text-gray-500">Essaie une requête plus large en anglais (ex. « name necklace », « gift for her »).</p>
                </div>
                <table x-show="seoTrending.keywords.length" class="w-full text-sm">
                  <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100">
                    <th class="pb-2 font-semibold">Mot-clé</th><th class="pb-2 font-semibold">Source</th><th class="pb-2 font-semibold text-right">Fréquence</th>
                  </tr></thead>
                  <tbody class="divide-y divide-gray-50">
                    <template x-for="k in seoTrending.keywords" :key="k.source + '-' + k.keyword">
                      <tr class="hover:bg-gray-50 transition">
                        <td class="py-2.5 font-medium" x-text="k.keyword"></td>
                        <td><span class="tag-pill" :class="seoSourceMeta(k.source).pill" x-text="seoSourceMeta(k.source).label"></span></td>
                        <td class="text-right num font-semibold" x-text="k.count || '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div x-show="seoTrending.taxonomy_paths.length" class="mt-4">
                  <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Catégories Etsy correspondantes</p>
                  <div class="flex flex-wrap gap-1.5"><template x-for="tp in seoTrending.taxonomy_paths" :key="tp"><span class="tag-pill bg-blue-50 text-blue-600" x-text="tp"></span></template></div>
                </div>
              </div>
            </template>

            <!-- Exemple de démo — masqué dès qu'une recherche réelle a été lancée -->
            <div x-show="!seoTrending && !seoTrendingLoading">
            <table class="w-full text-sm">
              <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100">
                <th class="pb-2 font-semibold">Mot-clé</th>
                <th class="pb-2 font-semibold">Volume est.</th>
                <th class="pb-2 font-semibold">
                  <span class="relative inline-flex items-center gap-1 group cursor-help">
                    Ventes totales <i class="fa-solid fa-circle-info text-gray-300 text-[10px]"></i>
                    <span class="pointer-events-none absolute left-0 bottom-full mb-2 hidden group-hover:block w-56 bg-ink-900 text-white text-[11px] font-normal normal-case leading-relaxed rounded-lg px-2.5 py-2 shadow-lg z-20">
                      Total des ventes Etsy de tous les produits utilisant ce mot-clé sur les 30 derniers jours
                    </span>
                  </span>
                </th>
                <th class="pb-2 font-semibold">Compétition</th>
                <th class="pb-2 font-semibold">Tendance</th>
                <th class="pb-2 font-semibold text-right">Score</th>
              </tr></thead>
              <tbody class="divide-y divide-gray-50">
                <tr><td class="py-2.5 font-medium">collier prénom personnalisé</td><td>4 200/mois</td><td class="font-semibold">184 500</td><td><span class="tag-pill bg-amber-100 text-amber-700">Moyen</span></td><td class="text-accent-dark font-semibold"><i class="fa-solid fa-arrow-trend-up"></i> +12%</td><td class="text-right"><span class="tag-pill bg-accent-light text-accent-dark">82/100</span></td></tr>

              <div class="flex items-center border border-gray-200 rounded-lg px-3 bg-white"><input type="number" min="0" step="0.01" x-model="pricingForm.cost_price" class="w-full py-2 outline-none text-sm bg-transparent num"><span class="text-gray-400 text-xs">€</span></div>
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Marge cible</label>
              <div class="flex items-center border border-gray-200 rounded-lg px-3 bg-white"><input type="number" min="0" max="95" step="1" x-model="pricingForm.target_margin_pct" class="w-full py-2 outline-none text-sm bg-transparent num"><span class="text-gray-400 text-xs">%</span></div>
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Prix actuel <span class="normal-case tracking-normal font-medium">(opt.)</span></label>
              <div class="flex items-center border border-gray-200 rounded-lg px-3 bg-white"><input type="number" min="0" step="0.01" x-model="pricingForm.current_price" placeholder="24,90" class="w-full py-2 outline-none text-sm bg-transparent num"><span class="text-gray-400 text-xs">€</span></div>
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Profil livraison</label>
              <select x-model="pricingForm.shipping_profile_id" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white">
                <option value="">Par défaut (6 pays)</option>
                <template x-for="pr in shippingProfiles" :key="'pp-'+pr.id"><option :value="pr.id" x-text="pr.name"></option></template>
              </select>
            </div>
            <!-- Produit fournisseur lié à la fiche (AliExpress/Eprolo/manuel) : coût d'achat réel -->
            <template x-if="pricingLinkedProduct()">
              <div class="col-span-2 lg:col-span-6 flex items-center justify-between flex-wrap gap-2 rounded-lg border border-accent/30 bg-accent-light/60 px-3 py-2">
                <p class="text-xs text-accent-dark"><i class="fa-solid fa-link mr-1"></i>Coût fournisseur lié (<span x-text="pricingLinkedProduct().source === 'aliexpress' ? 'AliExpress' : (pricingLinkedProduct().source || 'manuel')"></span>) : <span class="font-bold num" x-text="fmtLocal(pricingLinkedProduct().base_price, pricingLinkedProduct().currency)"></span><span x-show="pricingLinkedProduct().currency !== 'EUR'" class="num" x-text="' ≈ ' + fmtEur(linkedCostEur(pricingLinkedProduct()))"></span><span x-show="pricingLinkedProduct().shipping_days_estimate" x-text="' · ~' + pricingLinkedProduct().shipping_days_estimate + ' j de livraison'"></span></p>
                <button @click="pricingForm.cost_price = linkedCostEur(pricingLinkedProduct())" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition">Utiliser ce coût</button>
              </div>
            </template>
            <div class="col-span-2 lg:col-span-4 flex items-center gap-5 flex-wrap">
              <label class="flex items-center gap-2 text-xs font-semibold text-gray-600 cursor-pointer select-none"><input type="checkbox" x-model="pricingForm.free_shipping" class="accent-accent w-4 h-4">Livraison gratuite (port inclus dans le prix)</label>
              <label class="flex items-center gap-2 text-xs font-semibold text-gray-600 cursor-pointer select-none"><input type="checkbox" x-model="pricingForm.vat_applicable" class="accent-accent w-4 h-4">TVA applicable <span class="font-normal text-gray-400">(décoche si franchise en base)</span></label>
            </div>
            <div class="col-span-2 flex items-end justify-end">
              <button @click="runPricingAnalysis()" :disabled="pricingAnalyzing || !loggedIn" class="w-full lg:w-auto bg-accent hover:bg-accent-dark text-ink-900 font-bold text-sm px-5 py-2 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed transition">
                <i class="fa-solid mr-1.5" :class="pricingAnalyzing ? 'fa-spinner fa-spin' : 'fa-calculator'"></i><span x-text="pricingAnalyzing ? 'Analyse…' : 'Analyser'"></span>
              </button>
            </div>
          </div>
          <p x-show="pricingAnalyzeError" class="text-xs text-rose-500 mt-3" x-text="pricingAnalyzeError"></p>

          <!-- État vide -->
          <div x-show="!pricingAnalysis && !pricingAnalyzing" class="border border-dashed border-gray-200 rounded-xl p-8 text-center mt-4">
            <i class="fa-solid fa-earth-europe text-2xl text-gray-300 mb-2 block"></i>
            <p class="text-sm font-semibold text-ink-900 mb-1" x-text="loggedIn ? 'Lance une analyse pour voir le prix recommandé par pays' : 'Connecte-toi pour utiliser le moteur de prix'"></p>
            <p class="text-xs text-gray-500">Choisis une fiche pour pré-remplir coût, marge cible et prix actuel, ou saisis des valeurs libres.</p>
          </div>
          <div x-show="pricingAnalyzing" class="space-y-2 mt-4"><div class="skeleton h-9 rounded-lg"></div><div class="skeleton h-9 rounded-lg"></div><div class="skeleton h-9 rounded-lg"></div></div>

          <!-- Résultats -->
          <template x-if="pricingAnalysis && !pricingAnalyzing">
            <div class="mt-4 space-y-4 fade-enter">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="rounded-xl border border-gray-100 p-4">
                  <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1">Prix unique conseillé</p>
                  <p class="text-2xl font-extrabold text-ink-900 num" x-text="fmtEur(pricingAnalysis.suggested_single_price_eur)"></p>
                  <p class="text-[11px] text-gray-400 mt-1">Le plus élevé des prix recommandés : la marge tient dans tous les pays.</p>
                </div>
                <div class="rounded-xl border border-gray-100 p-4" x-show="pricingAnalysis.best_case">
                  <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1">Meilleur pays</p>
                  <p class="text-lg font-extrabold text-accent-dark" x-text="pricingAnalysis.best_case ? pricingAnalysis.best_case.flag + ' ' + pricingAnalysis.best_case.country_name : '—'"></p>
                  <p class="text-[11px] text-gray-400 mt-1" x-text="pricingAnalysis.best_case ? pricingAnalysis.best_case.reason : ''"></p>
                </div>
                <div class="rounded-xl border border-gray-100 p-4" x-show="pricingAnalysis.worst_case">
                  <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1">Pire cas</p>
                  <p class="text-lg font-extrabold text-rose-500" x-text="pricingAnalysis.worst_case ? pricingAnalysis.worst_case.flag + ' ' + pricingAnalysis.worst_case.country_name : '—'"></p>
                  <p class="text-[11px] text-gray-400 mt-1" x-text="pricingAnalysis.worst_case ? pricingAnalysis.worst_case.reason : ''"></p>
                </div>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-sm min-w-[980px]">
                  <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100">
                    <th class="pb-2 font-semibold">Pays</th><th class="pb-2 font-semibold">Prix recommandé</th><th class="pb-2 font-semibold">Livraison</th><th class="pb-2 font-semibold">Frais Etsy</th><th class="pb-2 font-semibold">Change</th><th class="pb-2 font-semibold">TVA</th><th class="pb-2 font-semibold">Net vendeur</th><th class="pb-2 font-semibold">Marge</th><th class="pb-2 font-semibold">Au prix actuel</th><th class="pb-2 font-semibold">Délai</th>
                  </tr></thead>
                  <tbody class="divide-y divide-gray-50">
                    <template x-for="r in pricingAnalysis.results" :key="r.country_code">
                      <tr class="hover:bg-gray-50 transition">
                        <td class="py-2.5 font-medium" x-text="r.flag + ' ' + r.country_name"></td>
                        <td><span class="font-semibold num" x-text="fmtEur(r.recommended_price_eur)"></span><span x-show="r.currency !== 'EUR'" class="text-[11px] text-gray-400 ml-1" x-text="'≈ ' + fmtLocal(r.recommended_price_local, r.currency)"></span></td>
                        <td x-text="r.shipping_charged_eur > 0 ? fmtEur(r.shipping_charged_eur) : 'Gratuite (' + fmtEur(r.shipping_cost_eur) + ' à ta charge)'"></td>
                        <td class="num" x-text="fmtEur(r.etsy_fees_eur)"></td>
                        <td class="num" x-text="fmtEur(r.currency_fee_eur)"></td>
                        <td><span class="num" x-text="fmtEur(r.vat_eur)"></span><span class="block text-[10px] text-gray-400 leading-tight" x-text="r.vat_label"></span></td>
                        <td class="font-semibold num" x-text="fmtEur(r.seller_net_eur)"></td>
                        <td><span class="tag-pill" :class="marginStatusPill(r.reachable ? r.status : 'bad')" x-text="r.reachable ? fmtEur(r.margin_eur) + ' · ' + fmtPct(r.margin_pct) : 'Inatteignable'"></span></td>
                        <td class="num font-semibold" :class="marginStatusClass(typeof r.current_margin_pct === 'number' ? (r.current_margin_pct < 0 ? 'bad' : (r.current_margin_pct >= pricingAnalysis.target_margin_pct ? 'good' : (r.current_margin_pct >= pricingAnalysis.target_margin_pct - 10 ? 'close' : 'bad'))) : 'unknown')" x-text="typeof r.current_margin_pct === 'number' ? (fmtPct(r.current_margin_pct) + (typeof r.current_margin_eur === 'number' ? ' · ' + fmtEur(r.current_margin_eur) : '')) : '—'"></td>
                        <td class="text-gray-500" x-text="r.delivery_days_min != null ? r.delivery_days_min + '-' + r.delivery_days_max + ' j' : '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <!-- Application sur Etsy (fiche réelle sélectionnée) -->
              <div x-show="pricingAnalysis.listing_id && pricingAnalysis.suggested_single_price_eur" class="flex items-center justify-between flex-wrap gap-3 p-4 rounded-xl border border-gray-100 bg-gray-50">
                <div>
                  <p class="text-sm font-semibold text-ink-900">Appliquer <span class="num" x-text="fmtEur(pricingAnalysis.suggested_single_price_eur)"></span> sur la fiche Etsy</p>
                  <p class="text-[11px] text-gray-400">Modifie le prix réel de la fiche (toutes les variantes au même prix). Visible immédiatement par les acheteurs.</p>
                  <p x-show="pricingApplyState.error" class="text-xs text-rose-500 mt-1" x-text="pricingApplyState.error"></p>
                  <p x-show="pricingApplyState.done" class="text-xs text-accent-dark mt-1" x-text="pricingApplyState.done ? 'Prix mis à jour sur Etsy (' + (pricingApplyState.done.method === 'inventory' ? pricingApplyState.done.offerings_updated + ' variante(s)' : 'fiche simple') + ').' : ''"></p>
                </div>
                <button @click="applyPriceOnEtsy(pricingAnalysis.listing_id, pricingAnalysis.suggested_single_price_eur, pricingApplyState)" :disabled="pricingApplyState.applying || !etsyConnected"
                        class="text-xs font-bold px-4 py-2 rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed"
                        :class="pricingApplyState.confirming ? 'bg-rose-500 text-white hover:bg-rose-600' : 'bg-ink-900 text-white hover:bg-ink-700'">
                  <i class="fa-solid mr-1.5" :class="pricingApplyState.applying ? 'fa-spinner fa-spin' : (pricingApplyState.confirming ? 'fa-triangle-exclamation' : 'fa-upload')"></i>
                  <span x-text="pricingApplyState.applying ? 'Mise à jour…' : (pricingApplyState.confirming ? 'Confirmer la modification sur Etsy' : 'Appliquer sur Etsy')"></span>
                </button>
              </div>
            </div>
          </template>
        </div>

        <!-- === PHASE 2 — PROFILS DE LIVRAISON (table shipping_profiles, /api/pricing/profiles) === -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-card p-5">
          <div class="flex items-start justify-between flex-wrap gap-3 mb-4">
            <div>
              <h3 class="font-bold text-sm text-ink-900">Profils de livraison</h3>
              <p class="text-xs text-gray-500 mt-0.5">Tes coûts de port réels par pays, réutilisables dans l'analyse de prix ci-dessus.</p>
            </div>
            <button @click="profileForm ? (profileForm = null) : newProfileForm()" :disabled="!loggedIn" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-ink-900 text-white hover:bg-ink-700 disabled:opacity-40 disabled:cursor-not-allowed transition"><i class="fa-solid mr-1" :class="profileForm ? 'fa-minus' : 'fa-plus'"></i><span x-text="profileForm ? 'Annuler' : 'Nouveau profil'"></span></button>
          </div>
          <p x-show="shippingProfilesError" class="text-xs text-rose-500 mb-3" x-text="shippingProfilesError"></p>

          <!-- Formulaire -->
          <template x-if="profileForm">
            <div class="p-4 rounded-xl bg-gray-50 border border-gray-100 space-y-3 mb-4 fade-enter">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2">
                  <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Nom du profil</label>
                  <input type="text" x-model="profileForm.name" maxlength="80" placeholder="ex. Mondial Standard, Livraison gratuite Europe" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-accent bg-white">
                </div>
                <div>
                  <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5">Marge cible</label>
                  <div class="flex items-center border border-gray-200 rounded-lg px-3 bg-white"><input type="number" min="0" max="95" x-model="profileForm.target_margin_pct" class="w-full py-2 outline-none text-sm bg-transparent num"><span class="text-gray-400 text-xs">%</span></div>
                </div>
              </div>
              <label class="flex items-center gap-2 text-xs font-semibold text-gray-600 cursor-pointer select-none"><input type="checkbox" x-model="profileForm.is_free_shipping" class="accent-accent w-4 h-4">Livraison gratuite pour l'acheteur (le port est absorbé dans le prix)</label>
              <div class="overflow-x-auto">
                <table class="w-full text-sm min-w-[560px]">
                  <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100"><th class="pb-2 font-semibold w-10"></th><th class="pb-2 font-semibold">Pays</th><th class="pb-2 font-semibold">Coût de port (€)</th><th class="pb-2 font-semibold">Délai min (j)</th><th class="pb-2 font-semibold">Délai max (j)</th></tr></thead>
                  <tbody class="divide-y divide-gray-50">
                    <template x-for="c in profileForm.countries" :key="'pfc-'+c.code">
                      <tr :class="!c.enabled && 'opacity-50'">
                        <td class="py-2"><input type="checkbox" x-model="c.enabled" class="accent-accent w-4 h-4"></td>
                        <td class="font-medium" x-text="c.flag + ' ' + c.name"></td>
                        <td><input type="number" min="0" step="0.1" x-model="c.shipping_cost" :disabled="!c.enabled" class="w-28 border border-gray-200 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-accent bg-white num"></td>
                        <td><input type="number" min="0" max="120" x-model="c.delivery_days_min" :disabled="!c.enabled" placeholder="—" class="w-20 border border-gray-200 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-accent bg-white num"></td>
                        <td><input type="number" min="0" max="180" x-model="c.delivery_days_max" :disabled="!c.enabled" placeholder="—" class="w-20 border border-gray-200 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-accent bg-white num"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <p x-show="profileForm.error" class="text-xs text-rose-500" x-text="profileForm.error"></p>
              <div class="flex justify-end gap-2">
                <button @click="profileForm = null" class="text-xs font-semibold px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 transition">Annuler</button>
                <button @click="saveShippingProfile()" :disabled="profileForm.saving" class="text-xs font-bold px-4 py-2 rounded-lg bg-accent text-ink-900 hover:bg-accent-dark disabled:opacity-40 transition"><i class="fa-solid mr-1.5" :class="profileForm.saving ? 'fa-spinner fa-spin' : 'fa-floppy-disk'"></i>Enregistrer le profil</button>
              </div>
            </div>
          </template>

          <!-- Non connecté / chargement / vide -->
          <div x-show="!loggedIn" class="border border-dashed border-gray-200 rounded-xl p-8 text-center">
            <i class="fa-solid fa-lock text-2xl text-gray-300 mb-2 block"></i>
            <p class="text-sm font-semibold text-ink-900 mb-1">Connecte-toi pour créer tes profils de livraison</p>
            <p class="text-xs text-gray-500">Ils alimentent l'analyse de prix avec tes vrais coûts de port.</p>
          </div>
          <div x-show="loggedIn && shippingProfilesLoading && !shippingProfiles.length" class="space-y-2"><div class="skeleton h-14 rounded-xl"></div><div class="skeleton h-14 rounded-xl"></div></div>
          <div x-show="loggedIn && !shippingProfilesLoading && !shippingProfiles.length && !profileForm" class="border border-dashed border-gray-200 rounded-xl p-8 text-center">
            <i class="fa-solid fa-truck-fast text-2xl text-gray-300 mb-2 block"></i>
            <p class="text-sm font-semibold text-ink-900 mb-1">Aucun profil de livraison</p>
            <p class="text-xs text-gray-500 mb-4">Sans profil, l'analyse utilise les coûts moyens par défaut. Crée un profil avec tes vrais tarifs fournisseur.</p>
            <button @click="newProfileForm()" class="bg-ink-900 hover:bg-ink-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition"><i class="fa-solid fa-plus mr-1"></i>Créer un profil</button>
          </div>

          <!-- Liste -->
          <div x-show="loggedIn && shippingProfiles.length" class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <template x-for="pr in shippingProfiles" :key="pr.id">
              <div class="border border-gray-100 rounded-xl p-4 card-hover transition">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <p class="text-sm font-semibold text-ink-900 truncate" x-text="pr.name"></p>
                    <p class="text-[11px] text-gray-400 mt-0.5"><span x-text="pr.countries.length + ' pays'"></span> · marge cible <span class="num" x-text="fmtPct(pr.target_margin_pct)"></span><span x-show="pr.is_free_shipping"> · livraison gratuite</span></p>
                  </div>
                  <div class="flex gap-1 flex-shrink-0">
                    <button @click="pricingForm.shipping_profile_id = pr.id; if (pr.is_free_shipping) pricingForm.free_shipping = true" class="text-[11px] font-semibold px-2 py-1 rounded-lg border transition" :class="pricingForm.shipping_profile_id === pr.id ? 'border-accent bg-accent-light text-accent-dark' : 'border-gray-200 hover:bg-gray-50'" x-text="pricingForm.shipping_profile_id === pr.id ? 'Utilisé' : 'Utiliser'"></button>
                    <button @click="deleteShippingProfile(pr)" class="text-[11px] font-semibold px-2 py-1 rounded-lg border transition" :class="profileDeleteConfirm === pr.id ? 'bg-rose-500 border-rose-500 text-white' : 'border-gray-200 hover:bg-rose-50 hover:text-rose-500'"><i class="fa-solid" :class="profileDeleteConfirm === pr.id ? 'fa-check' : 'fa-trash'"></i><span x-show="profileDeleteConfirm === pr.id" class="ml-1">Confirmer ?</span></button>
                  </div>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-3">
                  <template x-for="c in pr.countries" :key="pr.id + '-' + c.code">
                    <span class="tag-pill bg-gray-100 text-gray-700" x-text="c.code + ' · ' + fmtEur(c.shipping_cost)"></span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-card p-5">
          <h3 class="font-bold text-sm text-ink-900 mb-1">Impact d'une promotion boutique</h3>
          <p class="text-xs text-gray-500 mb-4">Basé sur le prix de vente et les coûts saisis dans le calculateur ci-dessus (<span x-text="(calc.price || 0).toFixed(2)+' €'" class="font-semibold"></span>).</p>
          <div class="flex flex-wrap gap-2 mb-4">
            <template x-for="pct in [5,10,15,20]" :key="pct">
              <button @click="simulatePromo(pct)" :class="promo.pct===pct ? 'bg-ink-900 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'" class="px-4 py-2 rounded-lg text-sm font-bold transition" x-text="'-'+pct+'%'"></button>
            </template>
          </div>

          <div x-show="promo.pct !== null" x-cloak class="space-y-3">
            <div class="grid grid-cols-2 gap-4 text-sm">
              <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-500 mb-1">Nouveau prix de vente</p>
                <p class="text-lg font-extrabold text-ink-900" x-text="promo.price.toFixed(2)+' €'"></p>
              </div>
              <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-500 mb-1">Nouvelle marge nette</p>
                <p class="text-lg font-extrabold" :class="promoMarginClass()" x-text="promo.marginEur.toFixed(2)+' € ('+promo.marginPct.toFixed(1)+'%)'"></p>
              </div>
            </div>
            <div x-show="promo.marginEur < 0" x-cloak class="bg-rose-50 border border-rose-200 text-rose-700 text-sm font-semibold rounded-lg p-3 flex items-center gap-2">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <span x-text="'Promotion non rentable — pertes de '+Math.abs(promo.marginEur).toFixed(2)+' € par vente'"></span>
            </div>
          </div>
        </div>
      </div></template>

      <!-- ================= TAXES & CHANGE ================= -->
      <template x-if="page==='taxes'"><div class="fade-enter space-y-6 max-w-7xl mx-auto">

        <div class="bg-white rounded-xl border border-gray-200 shadow-card">
          <div class="p-5 pb-4">
            <h3 class="font-bold text-sm text-ink-900">Fiscalité &amp; frais de change par pays</h3>
            <p class="text-xs text-gray-500 mt-0.5">Etsy collecte généralement la TVA à la source (IOSS) pour les envois vers l'UE, mais les droits de douane restent possibles au-delà de certains seuils.</p>
          </div>
          <div class="overflow-x-auto px-5 pb-5">
          <table class="w-full text-sm min-w-[760px]">
            <thead><tr class="text-left text-xs text-gray-500 border-b border-gray-100">
              <th class="pb-2 font-semibold">Pays</th><th class="pb-2 font-semibold">TVA</th><th class="pb-2 font-semibold">Seuil douane</th><th class="pb-2 font-semibold">Frais de change Etsy</th><th class="pb-2 font-semibold">Impact net sur marge</th>
            </tr></thead>
            <tbody class="divide-y divide-gray-50">
              <template x-for="c in countries" :key="c.code">
                <tr>
                  <td class="py-2.5 font-medium" x-text="c.flag+' '+c.name"></td>
                  <td x-text="c.vat"></td>

<script>
function app() {
  // Kept outside Alpine's reactive data on purpose: Alpine deep-proxies everything
  // returned below, and Chart.js instances mutated inside the same x-init effect
  // (read + write on the same reactive prop) re-trigger that effect, recreating
  // charts on canvases that are still in use.
  let chartInstances = {};
  // Populated by mountCharts() — the raw config factories, kept so Focus Mode
  // can build a brand-new, uninstrumented config for the same chart instead of
  // reusing (and thereby corrupting) the live chart's already-resolved options.
  let chartDefs = {};
  return {
    page: 'dashboard',
    sidebarOpen: false,
    darkMode: (() => { try { return localStorage.getItem('etsydrop_dark') === '1'; } catch(e) { return false; } })(),

    // ===== Intégration API réelle (voir le <script> EDAPI dans <head>) =====
    // Renseignés par window._edPostAuth() une fois connecté — restent à leurs
    // valeurs par défaut (déconnecté, aucun email) tant que la session
    // Supabase locale n'est pas restaurée ou que le formulaire n'a pas validé.
    etsyConnected: false,
    currentUserEmail: null,
    etsyShopName: null,
    etsyShopNameInput: '',
    etsyResyncing: false,
    // Agrégats réels de /api/analytics/revenue (voir _edPostAuth) —
    // top_products, répartition par statut et historique mensuel 12 mois.
    avgOrderValue: 0,
    topProducts: [],
    orderStatusBreakdown: {},
    revenueHistory: [],
    pendingOrdersCount() {
      return this.orders.filter(o => o.status === 'pending_supplier').length;
    },
    // Légende du donut "Statut des commandes" — même ordre/couleurs que le
    // dataset de chartOrdersStatus (voir mountCharts).
    orderStatusCounts() {
      if (!this.etsyConnected) {
        return [
          { key: 'delivered', label: 'Livrées', dot: 'bg-accent', count: 276 },
          { key: 'in_transit', label: 'En transit', dot: 'bg-blue-400', count: 48 },
          { key: 'pending_supplier', label: 'En attente', dot: 'bg-amber-400', count: 12 },
          { key: 'delayed', label: 'Retard/Litige', dot: 'bg-rose-400', count: 6 }
        ];
      }
      const b = this.orderStatusBreakdown || {};
      return [
        { key: 'in_transit', label: 'Expédiées', dot: 'bg-accent', count: b.in_transit || 0 },
        { key: 'pending_supplier', label: 'À expédier', dot: 'bg-amber-400', count: b.pending_supplier || 0 },
        { key: 'delivered', label: 'Livrées', dot: 'bg-blue-400', count: b.delivered || 0 },
        { key: 'return_requested', label: 'Remboursées/Annulées', dot: 'bg-rose-400', count: (b.return_requested || 0) + (b.delayed || 0) }
      ];
    },
    // Alertes déduites des données réelles — jamais de texte de démo une
    // fois connecté.
    realAlerts() {
      const alerts = [];
      const out = this.catalogProducts.filter(p => p.stock === 'rupture');
      const low = this.catalogProducts.filter(p => p.stock === 'stock_faible');
      out.slice(0, 2).forEach(p => alerts.push({ icon: 'fa-triangle-exclamation text-rose-500', strong: p.name, text: ' est en rupture de stock sur Etsy.' }));
      if (out.length > 2) alerts.push({ icon: 'fa-triangle-exclamation text-rose-500', strong: (out.length - 2) + ' autre(s) fiche(s)', text: ' en rupture de stock.' });
      if (low.length) alerts.push({ icon: 'fa-arrow-trend-down text-amber-500', strong: low.length + ' fiche(s)', text: ' avec un stock faible (< 5 unités).' });
      const pending = this.pendingOrdersCount();
      if (pending) alerts.push({ icon: 'fa-truck text-blue-500', strong: pending + ' commande(s)', text: ' payée(s) en attente d\'expédition.' });
      const noCost = this.catalogProducts.filter(p => p.costPrice === null || p.costPrice === undefined).length;
      if (noCost) alerts.push({ icon: 'fa-calculator text-gray-400', strong: noCost + ' fiche(s)', text: ' sans prix fournisseur — renseigne-le pour activer le simulateur de marge.' });
      return alerts.slice(0, 5);
    },
    // Totaux 12 mois depuis revenueHistory (page Analytics).
    yearTotals() {
      const h = Array.isArray(this.revenueHistory) ? this.revenueHistory : [];
      const revenue = h.reduce((s, m) => s + (m.revenue || 0), 0);
      const profit = h.reduce((s, m) => s + (m.profit || 0), 0);
      const orders = h.reduce((s, m) => s + (m.orders || 0), 0);
      return { revenue, profit, orders, marginPct: revenue ? (profit / revenue) * 100 : 0 };
    },
    catalogImageFor(etsyListingId) {
      const p = this.catalogProducts.find(x => x.etsyListingId === String(etsyListingId));
      return p ? p.image : (window.ED_NO_IMAGE || '');
    },

    // ===== Commandes (Etsy — flux de fulfillment) =====
    // Statut brut = valeur de l'enum OrderStatus (backend/models.py) — le
    // libellé/la couleur affichés viennent de orderStatusMeta() ci-dessous,
    // partagée entre les données de démo et les commandes réelles chargées
    // par window._edPostAuth().
    orders: [
      { id:'#EY-88213', customer:'Claire M.', product:'Collier prénom "Emma"', supplier:'Mon catalogue', amount:24.90, status:'delivered', tracking:'FR..8823JT' },
      { id:'#EY-88214', customer:'Julien P.', product:'Bracelet initiales "J&L"', supplier:'Mon catalogue', amount:18.90, status:'in_transit', tracking:'FR..2291KX' },
      { id:'#EY-88215', customer:'Sarah T.', product:'Bague prénom ajustable', supplier:'CJ Dropshipping', amount:20.40, status:'pending_supplier', tracking:'—' },
      { id:'#EY-88190', customer:'Marc D.', product:'Chaîne de cheville gravée', supplier:'CJ Dropshipping', amount:17.90, status:'delayed', tracking:'CN..7745QP' },
      { id:'#EY-88216', customer:'Léa B.', product:'Mug personnalisé prénom', supplier:'Printify', amount:19.90, status:'delivered', tracking:'FR..9013MZ' },
      { id:'#EY-88217', customer:'Thomas R.', product:"Boucles d'oreilles constellation", supplier:'Mon catalogue', amount:21.90, status:'in_transit', tracking:'FR..4471AL' },
      { id:'#EY-88180', customer:'Inès K.', product:'Collier zodiaque "Lion"', supplier:'Eprolo', amount:22.90, status:'return_requested', tracking:'FR..0032WD' }
    ],
    orderStatusMeta(status) {
      const map = {
        pending_supplier: { label: 'En attente fournisseur', pill: 'bg-amber-100 text-amber-700' },
        in_transit:       { label: 'En transit',             pill: 'bg-blue-50 text-blue-600' },
        delivered:        { label: 'Livrée',                 pill: 'bg-accent-light text-accent-dark' },
        delayed:          { label: 'Retard',                 pill: 'bg-rose-100 text-rose-600' },
        return_requested: { label: 'Retour demandé',         pill: 'bg-purple-100 text-purple-600' }
      };
      return map[status] || { label: status, pill: 'bg-gray-100 text-gray-600' };
    },
    orderRowClass(status) {
      if (status === 'delayed') return 'bg-rose-50/40';
      if (status === 'return_requested') return 'bg-purple-50/40';
      return '';
    },

    // ===== Command palette (Ctrl+K) =====
    paletteOpen: false,
    paletteQuery: '',
    paletteIndex: 0,
    paletteAllPages: [
      { type:'page', page:'dashboard', label:'Dashboard', icon:'fa-house' },
      { type:'page', page:'catalogue', label:'Catalogue', icon:'fa-swatchbook' },
      { type:'page', page:'sourcing', label:'Sourcing multi-sources', icon:'fa-layer-group' },
      { type:'page', page:'orders', label:'Commandes & Fulfillment', icon:'fa-truck-fast' },
      { type:'page', page:'mockups', label:'Mockups IA', icon:'fa-image' },
      { type:'page', page:'seo', label:'SEO & Mots-clés', icon:'fa-magnifying-glass' },
      { type:'page', page:'rank', label:'Rank Tracker', icon:'fa-ranking-star' },
      { type:'page', page:'competitors', label:'Analyse concurrents', icon:'fa-crosshairs' },
      { type:'page', page:'niches', label:'Niche Finder', icon:'fa-compass' },
      { type:'page', page:'promotion', label:'Promotion', icon:'fa-bullhorn' },
      { type:'page', page:'analytics', label:'Analytics', icon:'fa-chart-line' },
      { type:'page', page:'shipping', label:'Coûts & Expédition', icon:'fa-globe' },
      { type:'page', page:'taxes', label:'Taxes & Change', icon:'fa-landmark' },
      { type:'page', page:'ai', label:'Conseils IA', icon:'fa-robot' },
      { type:'page', page:'settings', label:'Intégrations & Paramètres', icon:'fa-gear' }
    ],
    paletteResults() {
      const q = this.paletteQuery.trim().toLowerCase();
      const pages = this.paletteAllPages.filter(p => !q || p.label.toLowerCase().includes(q)).slice(0, 8);
      const products = (this.catalogProducts || [])
        .filter(p => !q || p.name.toLowerCase().includes(q))
        .slice(0, 6)
        .map(p => ({ type: 'product', id: p.id, name: p.name, product: p }));
      return { pages, products };
    },
    paletteFlatList() {
      const r = this.paletteResults();
      return r.pages.concat(r.products);
    },

    _revenueAnimId: 0,
    animateRevenue(from, to, duration) {
      // Jeton : une nouvelle animation (ex. vraie valeur chargée par
      // _edPostAuth pendant le count-up de démo) annule la précédente, sinon
      // les frames restantes de l'ancienne écrasent la valeur réelle.
      const id = ++this._revenueAnimId;
      const start = performance.now();
      const step = (now) => {
        if (id !== this._revenueAnimId) return;
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        this.revenueDisplay = from + (to - from) * eased;
        if (t < 1) requestAnimationFrame(step);
        else this.revenueDisplay = to;
      };
      requestAnimationFrame(step);
    },

        if (this.etsyConnected) return;
        const previousTotal = this.revenueTotal;
        this.revenueTotal += Math.random() * 63 + 24;
        this.animateRevenue(previousTotal, this.revenueTotal, 800);
        this.revenueFlash = true;
        setTimeout(() => { this.revenueFlash = false; }, 800);
      }, 30000);

      if (!product || product.baseCost === null || product.baseCost === undefined) return [];
      // Marge cible réelle de la fiche (listings.target_margin, 35% par défaut),
      // bornée pour que le dénominateur reste > 0.
      const targetMargin = Math.min(0.9, Math.max(0, (typeof product.targetMargin === 'number' ? product.targetMargin : 35) / 100));
      return this.countries.map(c => {
        const shippingCost = product.freeShipping ? c.shipping : 0;
        const sellerCost = product.baseCost + shippingCost;
        const changePct = c.changeFeePct / 100;
        const price = (sellerCost + 0.20) / Math.max(0.05, 1 - 0.065 - changePct - targetMargin);
        const etsyFee = price * 0.065 + 0.20;
        const changeFee = price * changePct;
        const marginEur = price - sellerCost - etsyFee - changeFee;
        const marginPct = price > 0 ? (marginEur / price) * 100 : 0;
        return {
          code: c.code, flag: c.flag, name: c.name, vat: c.vat,
          price, etsyFee, shipping: product.freeShipping ? 'Gratuite' : c.shipping,
          changeFee, marginEur, marginPct
        };
      });

    sparklineSvg(values) {
      if (!values || !values.length) return '';
      const min = Math.min(...values), max = Math.max(...values);
      const range = (max - min) || 1;
      const last = values.length - 1;
      const points = values.map((v, i) => [(i / last) * 60 + 2, 22 - ((v - min) / range) * 20]);
      const pts = points.map(([x, y]) => x.toFixed(2) + ',' + y.toFixed(2)).join(' ');
      const trendUp = values[last] >= values[0];
      const color = trendUp ? '#00C896' : '#F43F5E';
      const [lastX, lastY] = points[last];
      return '<svg viewBox="0 0 64 24" width="64" height="24">'
        + '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"></polyline>'
        + '<circle cx="' + lastX.toFixed(2) + '" cy="' + lastY.toFixed(2) + '" r="2" fill="' + color + '"></circle>'
        + '</svg>';

      try {
        const d = await window.EDAPI.aliexpressProduct(p.product_id);
        if (this.aliDetail && this.aliDetail.product_id === p.product_id) this.aliDetail = Object.assign({ loading: false }, d);
      } catch (e) {
        if (this.aliDetail) { this.aliDetail.loading = false; this.aliDetail.warnings = [(e.message || 'Détail indisponible.')]; }
      }
    },
    async importAliProduct(p) {
      if (!p || this.aliImporting) return;
      this.aliImporting = p.product_id; this.aliSearch.error = ''; this.aliSearch.notice = '';
      const payload = { product_id: p.product_id };
      if (this.aliSearch.listing_id) payload.listing_id = this.aliSearch.listing_id;
      try {
        const r = await window.EDAPI.aliexpressImport(payload);
        this.aliImported[p.product_id] = true;
        const linked = r.linked_etsy_listing_id ? ' et lié à la fiche « ' + (this.listingNameForEtsyId(r.linked_etsy_listing_id) || r.linked_etsy_listing_id) + ' »' : '';
        this.aliSearch.notice = (r.updated ? 'Produit mis à jour' : 'Produit importé') + ' dans ton fournisseur AliExpress' + linked + '.';
        this.loadSuppliers();
        this.loadLinkedSupplierProducts();
      } catch (e) {
        this.aliSearch.error = 'Import impossible : ' + (e.message || 'erreur inconnue');
      } finally {
        this.aliImporting = null;
      }
    },

    // =====================================================================
    // ===== PRODUITS FOURNISSEUR LIÉS (coût d'achat réel par fiche Etsy) =====
    // =====================================================================
    linkedSupplierProducts: [],
    async loadLinkedSupplierProducts() {
      if (!this.loggedIn) return;
      try {
        const list = await window.EDAPI.linkedSupplierProducts();
        this.linkedSupplierProducts = Array.isArray(list) ? list : [];
      } catch (e) {
        console.warn('[EtsyDrop] produits liés indisponibles :', e.message);
      }
    },
    linkedProductForEtsyId(etsyListingId) {
      if (!etsyListingId) return null;
      return this.linkedSupplierProducts.find(p => String(p.linked_etsy_listing_id) === String(etsyListingId)) || null;
    },
    linkedCostEur(sp) {
      if (!sp || typeof sp.base_price !== 'number') return 0;
      const eur = sp.currency === 'USD' ? this.usdToEur(sp.base_price) : sp.base_price;
      return Math.round((eur || 0) * 100) / 100;
    },
    pricingLinkedProduct() {
      const l = this.pricingSelectedListing();
      return l ? this.linkedProductForEtsyId(l.etsyListingId) : null;
    },

    // =====================================================================
    // ===== DIAGNOSTIC CONNEXION ETSY (Paramètres) =====
    // =====================================================================
    etsyDebug: { open: false, loading: false, data: null, error: '' },
    async runEtsyDebug() {
      const d = this.etsyDebug;
      d.open = true; d.loading = true; d.error = '';
      try {
        d.data = await window.EDAPI.etsyDebug();
      } catch (e) {
        d.error = e.message || 'Diagnostic impossible.';
      } finally {
        d.loading = false;
      }
    },
    etsyDebugRows() {
      const x = this.etsyDebug.data;
      if (!x) return [];
      const exp = x.expires_at ? new Date(x.expires_at) : null;
      const remaining = typeof x.seconds_remaining === 'number' ? x.seconds_remaining : null;
      return [
        { label: 'Boutique connectée', value: x.connected ? 'Oui' : 'Non', ok: x.connected },
        { label: 'shop_id', value: x.shop_id ? String(x.shop_id) + (x.shop_name ? ' (' + x.shop_name + ')' : '') : 'absent', ok: !!x.shop_id },
        { label: 'Token OAuth en base', value: x.has_access_token ? (x.has_refresh_token ? 'access + refresh' : 'access seul') : 'aucun', ok: x.has_access_token && x.has_refresh_token },
        { label: 'Token valide', value: x.token_valid ? ('Oui' + (remaining != null ? ' (' + Math.max(0, Math.round(remaining / 60)) + ' min restantes)' : '')) : 'Expiré / absent', ok: x.token_valid },
        { label: 'Expire le', value: exp && !isNaN(exp) ? exp.toLocaleString('fr-FR') : '—', ok: null },
        { label: 'API publique Etsy (clé d\'app)', value: x.public_api_ok ? 'OK' + (x.etsy_active_listings != null ? ' · ' + x.etsy_active_listings + ' fiche(s) active(s)' : '') : 'Échec', ok: x.public_api_ok },
        { label: 'Sonde OAuth (appel authentifié)', value: x.oauth_probe_ok === null || x.oauth_probe_ok === undefined ? 'non testée' : (x.oauth_probe_ok ? 'OK' : 'Échec'), ok: x.oauth_probe_ok === null || x.oauth_probe_ok === undefined ? null : x.oauth_probe_ok },
        { label: 'Fiches en base', value: String(x.listings_in_db), ok: x.listings_in_db > 0 ? true : null },
        { label: 'Commandes en base', value: String(x.orders_in_db), ok: null }
      ];
    },

    init() {
      this.computeCalc();
      this.$watch('calc.cost', () => this.computeCalc());
      this.$watch('calc.shipping', () => this.computeCalc());
      this.$watch('calc.price', () => this.computeCalc());
      this.$watch('page', () => this.$nextTick(() => this.mountCharts()));
      this.$nextTick(() => this.mountCharts());

      // Command palette
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          this.paletteOpen = true;
        }
      });
      this.$watch('paletteOpen', open => {
        if (open) {
          this.paletteIndex = 0;
          this.$nextTick(() => this.$refs.paletteInput && this.$refs.paletteInput.focus());
        } else {
          this.paletteQuery = '';
          this.paletteIndex = 0;
        }
      });
      this.$watch('paletteQuery', () => { this.paletteIndex = 0; });

      // Live revenue ticker
      this.startRevenueTicker();
    }
  }
}
</script>
</body>
</html>
